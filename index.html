<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PachaMirai</title>
<style>
*{margin:0;padding:0;touch-action:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:monospace}
#c{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#ui>div{pointer-events:auto}
#hud{position:absolute;top:0;left:0;right:0;height:36px;background:rgba(0,0,0,0.85);border-bottom:2px solid #333;display:flex;align-items:center;justify-content:space-between;padding:0 6px;color:#fff;font-size:10px}
.bar-bg{width:50px;height:6px;background:#222;border:1px solid #444;overflow:hidden}
.bar-fill{height:100%}
#mm{width:40px;height:40px;background:#111;border:2px solid #444;overflow:hidden}
#mm canvas{width:100%;height:100%}
#hb{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:1px;background:rgba(0,0,0,0.8);padding:3px;border:2px solid #444}
.s{width:30px;height:30px;background:#222;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative}
.s .c{position:absolute;bottom:0;right:1px;font-size:7px;color:#ff0}
#joy{position:absolute;bottom:50px;left:30px;width:90px;height:90px;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.3);border-radius:50%;touch-action:none}
#jk{position:absolute;top:50%;left:50%;width:36px;height:36px;background:rgba(255,255,255,0.4);border-radius:50%;transform:translate(-50%,-50%)}
#btns{position:absolute;bottom:50px;right:30px;display:flex;flex-direction:column;gap:8px}
.b{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;touch-action:none}
#dlg{display:none;position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;padding:8px 14px;border:2px solid #666;font-size:11px;max-width:80%}
</style>
</head>

<canvas id="c"></canvas>

      <span id="g">🪙 50</span>

    </div>
  </div>
  <div id="hb">

  // Cargar imágenes
  const IMG={tiles:{},trees:{},hero:{}};
  
  function loadImages(){
    for(const k in TILES){
      IMG.tiles[k]=new Image();
      IMG.tiles[k].src="data:image/png;base64,"+TILES[k];
    }
    for(const k in TREES){
      IMG.trees[k]=new Image();
      IMG.trees[k].src="data:image/png;base64,"+TREES[k];
    }
    for(const k in HERO){
      IMG.hero[k]=new Image();
      IMG.hero[k].src="data:image/png;base64,"+HERO[k];
    }
  }
  loadImages();
  
  // =============================================
  // MAPA CON CAPAS
  // =============================================
  
  // ground: 0=pasto, 1=tierra, 2=agua, 3=arena, 4=piedra, 5=nieve, 6=bosque
  const map=[];
  
  function initMap(){
    for(let y=0;y<WH;y++){
      map[y]=[];
      for(let x=0;x<WW;x++){
        const v=h(x,y),r=(v%1000)/1000;
        let ground=0;
        if(r<0.12)ground=2;
        else if(r<0.22)ground=3;
        else if(r<0.35)ground=6;
        else if(r<0.55)ground=0;
        else if(r<0.70)ground=1;
        else if(r<0.82)ground=4;
        else ground=5;
        
        map[y][x]={
          ground:ground,
          variant:v%4,
          deco:h(x*7+y*13)%4, // 0=árbol, 1=roca, 2=arbusto, 3=flor
          hasTree:(ground===6)
        };
      }
    }
    // Suavizar
    for(let i=0;i<2;i++){
      const n=map.map(r=>r.map(c=>({...c})));
      for(let y=1;y<WH-1;y++)for(let x=1;x<WW-1;x++){
        const c={};
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
          const g=map[y+dy][x+dx].ground;c[g]=(c[g]||0)+1;
        }
        let mg=0,mc=0;
        for(const g in c)if(c[g]>mc){mc=c[g];mg=g}
        if(mc>=5)n[y][x].ground=mg;
      }
      for(let y=0;y<WH;y++)for(let x=0;x<WW;x++){
        map[y][x].ground=n[y][x].ground;
        map[y][x].hasTree=(map[y][x].ground===6);
      }
    }
  }
  initMap();
  
  // =============================================
  // ENTIDADES
  // =============================================
  
  const E=[];
  const AT=['deer','boar','rabbit','fox','wolf','bird','cow','sheep','pig','dog','cat','chicken','fish'];
  for(let i=0;i<8;i++){
    E.push({t:'a',a:AT[i],x:10+(h(i,100)%20)*T,y:10+(h(i,200)%20)*T,vx:0,vy:0,f:0,ft:0,hp:3,dir:0});
  }
  E.push({t:'n',n:'Viejo',x:16*T,y:14*T,d:['Bienvenido a PachaMirai','Explora el mundo'],dir:0,f:0,ft:0});
  E.push({t:'n',n:'Guarda',x:24*T,y:20*T,d:['Cuida la naturaleza'],dir:0,f:0,ft:0});
  
  const P={x:WW*T/2,y:WH*T/2,cx:WW*T/2,cy:WH*T/2,vx:0,vy:0,dir:0,f:0,st:'idle',atk:0,hp:100,mhp:100,mp:50,mmp:50,xp:0,lv:1,g:50,inv:{wood:0,stone:0,potion:3}};
  let jx=0,jy=0;
  
  // =============================================
  // RENDER POR CAPAS
  // =============================================
  
  function getTileName(ground,variant){
    const names=['grass','dirt','water','sand','stone','snow','grass'];
    return names[ground]+'_'+variant;
  }
  
  function drawTileSprite(px,py,size,tileKey){
    const img=IMG.tiles[tileKey];
    if(img&&img.complete&&img.naturalWidth>0){
      ctx.drawImage(img,px,py,size,size);
      return true;
    }
    return false;
  }
  
  function drawGround(px,py,size,ground,variant){
    const tileKey=getTileName(ground,variant);
    if(!drawTileSprite(px,py,size,tileKey)){
      // Fallback
      const colors=['#4caf50','#8d6e63','#0288d1','#f9a825','#757575','#fff','#4caf50'];
      ctx.fillStyle=colors[ground]||'#4caf50';
      ctx.fillRect(px,py,size,size);
    }
  }
  
  function drawTree(px,py,size,variant){
    const treeKeys=['tree_6_13','tree_2_11','tree_0_11','tree_1_11'];
    const key=treeKeys[variant%treeKeys.length];
    const img=IMG.trees[key];
    
    if(img&&img.complete&&img.naturalWidth>0){
      ctx.drawImage(img,px,py,size,size);
    } else {
      // Fallback
      ctx.fillStyle='#5d4037';
      ctx.fillRect(px+12,py+14,8,18);
      ctx.fillStyle='#1b5e20';
      ctx.beginPath();ctx.arc(px+16,py+10,12,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#2e7d32';
      ctx.beginPath();ctx.arc(px+14,py+8,8,0,Math.PI*2);ctx.fill();
    }
  }
  
  function drawRock(px,py,size){
    ctx.fillStyle='#757575';
    ctx.beginPath();ctx.arc(px+16,py+24,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#616161';
    ctx.beginPath();ctx.arc(px+14,py+22,6,0,Math.PI*2);ctx.fill();
  }
  
  function drawBush(px,py,size){
    ctx.fillStyle='#2e7d32';
    ctx.beginPath();ctx.arc(px+16,py+26,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#388e3c';
    ctx.beginPath();ctx.arc(px+14,py+24,5,0,Math.PI*2);ctx.fill();
  }
  
  function drawFlower(px,py,size){
    ctx.fillStyle='#f44336';
    ctx.fillRect(px+14,py+22,4,4);
    ctx.fillStyle='#ffeb3b';
    ctx.fillRect(px+15,py+23,2,2);
  }
  
  function drawHero(cx,cy,z,atk){
    const dirNames=['dir0','dir1','dir2','dir3'];
    const dirKey=dirNames[P.dir];
    const frameNum=P.st==='walk'?P.f%4:(P.st==='attack'?2:0);
    const spriteKey='hero_'+dirKey+'_f'+frameNum;
    
    const img=IMG.hero[spriteKey];
    if(img&&img.complete&&img.naturalWidth>0){
      ctx.drawImage(img,cx-16*z,cy-16*z,32*z,32*z);
    } else {
      // Fallback
      ctx.fillStyle='#1565c0';
      ctx.fillRect(cx-8*z,cy-8*z,16*z,14*z);
      ctx.fillStyle='#ffccbc';
      ctx.fillRect(cx-6*z,cy-16*z,12*z,10*z);
      ctx.fillStyle='#5d4037';
      ctx.fillRect(cx-7*z,cy-18*z,14*z,4*z);
    }
  }
  
  function drawNPC(cx,cy,z,name){
    // Fallback NPC
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(cx,cy+16*z,8*z,3*z,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e91e63';
    ctx.fillRect(cx-7*z,cy-8*z,14*z,14*z);
    ctx.fillStyle='#ffccbc';
    ctx.fillRect(cx-5*z,cy-16*z,10*z,10*z);
    ctx.fillStyle='#5d4037';
    ctx.fillRect(cx-6*z,cy-18*z,12*z,4*z);
    ctx.fillStyle='#fc0';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText(name,cx,cy-22*z);
  }
  
  function drawAnimal(cx,cy,z,animal,frame){
    const AC={deer:[160,120,80],boar:[80,60,40],rabbit:[240,240,240],fox:[200,80,20],wolf:[80,80,80],bird:[40,100,200],cow:[250,250,250],sheep:[250,250,240],pig:[250,180,180],horse:[120,80,60],dog:[250,250,240],cat:[200,100,50],chicken:[250,250,240],fish:[100,180,255]};
    const c=AC[animal]||[150,150,150];
    const bob=frame%2===0?0:-1;
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();ctx.ellipse(cx,cy+12*z,8*z,3*z,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';
    ctx.beginPath();ctx.ellipse(cx,cy+4*z+bob,10*z,6*z,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+10*z,cy-2*z+bob,5*z,4*z,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.fillRect(cx+12*z,cy-3*z+bob,2*z,2*z);
  }
  
  // =============================================
  // RENDER
  // =============================================
  
  function render(){
    const w=cv.width,h=cv.height;
    const z=2,ts=T*z;
    const cx=w/2,cy=h/2;
    
    // Cámara suave
    P.cx+=(P.x-P.cx)*0.15;
    P.cy+=(P.y-P.cy)*0.15;
    
    // Fondo
    ctx.fillStyle='#1a3a1a';
    ctx.fillRect(0,0,w,h);
    
    const sx=Math.max(0,Math.floor(P.cx/T)-Math.ceil(w/ts/2)-3);
    const sy=Math.max(0,Math.floor(P.cy/T)-Math.ceil(h/ts/2)-3);
    const ex=Math.min(WW,Math.ceil(P.cx/T)+Math.ceil(w/ts/2)+3);
    const ey=Math.min(WH,Math.ceil(P.cy/T)+Math.ceil(h/ts/2)+3);
    
    // CAPA 1: TERRENO
    for(let ty=sy;ty<ey;ty++){
      for(let tx=sx;tx<ex;tx++){
        const tile=map[ty][tx];
        const px=cx+(tx*T-P.cx)*z;
        const py=cy+(ty*T-P.cy)*z;
        drawGround(px,py,ts,tile.ground,tile.variant);
      }
    }
    
    // CAPA 2: DECORACIÓN (árboles, rocas, arbustos)
    for(let ty=sy;ty<ey;ty++){
      for(let tx=sx;tx<ex;tx++){
        const tile=map[ty][tx];
        const px=cx+(tx*T-P.cx)*z;
        const py=cy+(ty*T-P.cy)*z;
        
        if(tile.hasTree){
          drawTree(px,py,ts,tile.variant);
        } else if(tile.deco===1){
          drawRock(px,py,ts);
        } else if(tile.deco===2){
          drawBush(px,py,ts);
        } else if(tile.deco===3){
          drawFlower(px,py,ts);
        }
      }
    }
    
    // CAPA 3: ENTIDADES (ordenadas por Y)
    const renderList=[];
    
    renderList.push({y:P.cy,render:()=>{ drawHero(cx,cy,z,P.atk>0); }});
    
    for(const e of E){
      const esx=cx+(e.x-P.cx)*z;
      const esy=cy+(e.y-P.cy)*z;
      if(esx<-50||esx>cv.width+50||esy<-50||esy>cv.height+50)continue;
      
      if(e.t==='a'){
        renderList.push({y:e.y,render:()=>{ drawAnimal(esx,esy,z,e.a,e.f); }});
      } else {
        renderList.push({y:e.y,render:()=>{ drawNPC(esx,esy,z,e.n); }});
      }
    }
    
    renderList.sort((a,b)=>a.y-b.y);
    for(const r of renderList){
      r.render();
    }
  }
  
  // Minimapa
  function renderMM(){
    const mc=document.getElementById('mc');if(!mc)return;
    const mctx=mc.getContext('2d');
    mctx.fillStyle='#1a1a2e';mctx.fillRect(0,0,40,40);
    const r=12,ppx=Math.floor(P.cx/T),ppy=Math.floor(P.cy/T);
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      const wx=ppx+dx,wy=ppy+dy;if(wx<0||wx>=WW||wy<0||wy>=WH)continue;
      const t=map[wy][wx].ground;
      mctx.fillStyle=t===0?'#4caf50':t===1?'#8d6e63':t===2?'#0288d1':t===3?'#f9a825':t===4?'#757575':t===5?'#fff':'#1b5e20';
      mctx.fillRect(20+dx*1.5,20+dy*1.5,1.5,1.5);
    }
    mctx.fillStyle='#fff';mctx.fillRect(19,19,2,2);
    mctx.fillStyle='#fc0';
    for(const e of E)if(e.t==='n'){const nx=20+Math.floor((e.x/T-ppx)*1.5),ny=20+Math.floor((e.y/T-ppy)*1.5);if(nx>0&&nx<40&&ny>0&&ny<40)mctx.fillRect(nx-1,ny-1,3,3)}
  }
  
  // =============================================
  // CONTROLES
  // =============================================
  
  const joy=document.getElementById('joy');
  const knob=document.getElementById('jk');
  let active=false,joyCX=0,joyCY=0;
  
  joy.addEventListener('touchstart',function(e){
    e.preventDefault();active=true;
    const r=joy.getBoundingClientRect();
    joyCX=r.left+r.width/2;joyCY=r.top+r.height/2;
    if(e.touches[0])moveJoy(e.touches[0]);
  },{passive:false});
  
  joy.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(active&&e.touches[0])moveJoy(e.touches[0]);
  },{passive:false});
  
  joy.addEventListener('touchend',function(e){
    e.preventDefault();active=false;jx=0;jy=0;
    knob.style.transform='translate(-50%,-50%)';
  });
  
  function moveJoy(t){
    const dx=t.clientX-joyCX,dy=t.clientY-joyCY;
    const d=Math.min(Math.sqrt(dx*dx+dy*dy),25);
    const a=Math.atan2(dy,dx);
    knob.style.transform='translate(calc(-50% + '+Math.cos(a)*d+'px), calc(-50% + '+Math.sin(a)*d+'px))';
    jx=d>5?Math.cos(a)*d/25:0;
    jy=d>5?Math.sin(a)*d/25:0;
  }
  
  document.getElementById('ba').onclick=atk;
  document.getElementById('bb').onclick=int_;
  document.getElementById('bc').onclick=()=>dlg('Madera: '+P.inv.wood+' | Piedra: '+P.inv.stone);
  
  function atk(){if(P.atk>0)return;P.atk=0.4;P.st='attack';for(let i=E.length-1;i>=0;i--){const e=E[i];if(e.t!=='a')continue;if(Math.hypot(e.x-P.x,e.y-P.y)<40){e.hp--;if(e.hp<=0){P.xp+=10;E.splice(i,1);dlg('+10 XP')}}}}
  function int_(){for(const e of E)if(e.t==='n'&&Math.hypot(e.x-P.x,e.y-P.y)<50){dlg(e.n+': '+e.d[Math.floor(Math.random()*e.d.length)]);return}}
  function dlg(t){const d=document.getElementById('dlg');d.textContent=t;d.style.display='block';setTimeout(()=>d.style.display='none',2000)}
  
  // Update
  function update(dt){
    const sp=80;
    P.vx=jx*sp;P.vy=jy*sp;
    P.x+=P.vx*dt;P.y+=P.vy*dt;
    P.x=Math.max(T,Math.min(WW*T-T,P.x));
    P.y=Math.max(T,Math.min(WH*T-T,P.y));
    
    if(Math.abs(jx)>Math.abs(jy))P.dir=jx>0?2:1;
    else if(jy!==0)P.dir=jy>0?0:3;
    
    if(P.atk>0){P.st='attack';P.atk-=dt}
    else if(Math.abs(P.vx)>1||Math.abs(P.vy)>1)P.st='walk';
    else P.st='idle';
    
    P.ft+=dt;if(P.ft>0.4){P.ft=0;P.f=(P.f+1)%4}
    
    for(const e of E){
      if(e.t!=='a')continue;
      const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy);
      if(d<80&&d>0){e.vx=-dx/d*60;e.vy=-dy/d*60}
      else if(d>200){e.vx=(Math.random()-0.5)*40;e.vy=(Math.random()-0.5)*40}
      else{e.vx*=0.95;e.vy*=0.95}
      e.x+=e.vx*dt;e.y+=e.vy*dt;
      e.x=Math.max(T,Math.min(WW*T-T,e.x));
      e.y=Math.max(T,Math.min(WH*T-T,e.y));
      e.ft+=dt;if(e.ft>0.4){e.ft=0;e.f=(e.f+1)%4}
      if(Math.abs(e.vx)>Math.abs(e.vy))e.dir=e.vx>0?2:1;
      else if(e.vy!==0)e.dir=e.vy>0?0:3;
    }
    
    if(P.xp>=P.lv*50){P.xp-=P.lv*50;P.lv++;P.mhp+=10;P.hp=P.mhp;dlg('NIVEL '+P.lv+'!')}
    
    document.getElementById('hp-fill').style.width=(P.hp/P.mhp*100)+'%';
    document.getElementById('mp-fill').style.width=(P.mp/P.mmp*100)+'%';
    document.getElementById('xp-fill').style.width=(P.xp/(P.lv*50)*100)+'%';
    document.getElementById('hp-txt').textContent=P.hp+'/'+P.mhp;
    document.getElementById('mp-txt').textContent=P.mp+'/'+P.mmp;
    document.getElementById('xp-txt').textContent=P.xp+'/'+(P.lv*50);
    document.getElementById('lvl').textContent='Nv '+P.lv;
    document.getElementById('g').textContent='🪙 '+P.g;
    document.getElementById('wc').textContent=P.inv.wood;
    document.getElementById('sc').textContent=P.inv.stone;
    document.getElementById('pc').textContent=P.inv.potion;
  }
  
  let last=0;
  function loop(ts){
    const dt=Math.min((ts-last)/1000,0.1);
    last=ts;
    update(dt);
    render();
    renderMM();
    requestAnimationFrame(loop);
  }
  
  last=performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
