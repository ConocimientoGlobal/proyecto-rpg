<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PachaMirai</title>
<style>
*{margin:0;padding:0;touch-action:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:monospace}
#c{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#ui>div{pointer-events:auto}
#hud{position:absolute;top:0;left:0;right:0;height:36px;background:rgba(0,0,0,0.85);border-bottom:2px solid #333;display:flex;align-items:center;justify-content:space-between;padding:0 6px;color:#fff;font-size:10px}
.bar-bg{width:50px;height:6px;background:#222;border:1px solid #444;overflow:hidden}
.bar-fill{height:100%}
#mm{width:40px;height:40px;background:#111;border:2px solid #444;overflow:hidden}
#mm canvas{width:100%;height:100%}
#hb{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:1px;background:rgba(0,0,0,0.8);padding:3px;border:2px solid #444}
.s{width:30px;height:30px;background:#222;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative}
.s .c{position:absolute;bottom:0;right:1px;font-size:7px;color:#ff0}
#joy{position:absolute;bottom:50px;left:30px;width:90px;height:90px;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.3);border-radius:50%;touch-action:none}
#jk{position:absolute;top:50%;left:50%;width:36px;height:36px;background:rgba(255,255,255,0.4);border-radius:50%;transform:translate(-50%,-50%)}
#btns{position:absolute;bottom:50px;right:30px;display:flex;flex-direction:column;gap:8px}
.b{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;touch-action:none}
#dlg{display:none;position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;padding:8px 14px;border:2px solid #666;font-size:11px;max-width:80%}
#menu{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.mb{width:160px;padding:10px;background:#222;border:2px solid #666;color:#fff;font-size:14px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="hud">
    <div style="display:flex;align-items:center;gap:6px">
      <div>HP <span id="hp-txt">100/100</span><div class="bar-bg"><div class="bar-fill" id="hp-fill" style="width:100%;background:#e44"></div></div></div>
      <div>MP <span id="mp-txt">50/50</span><div class="bar-bg"><div class="bar-fill" id="mp-fill" style="width:100%;background:#48f"></div></div></div>
      <div>XP <span id="xp-txt">0/50</span><div class="bar-bg"><div class="bar-fill" id="xp-fill" style="width:0%;background:#fc0"></div></div></div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <span id="lvl">Nv 1</span>
      <span id="g">🪙 50</span>
      <div id="mm"><canvas id="mc" width="40" height="40"></canvas></div>
    </div>
  </div>
  <div id="hb">
    <div class="s">⚔️</div><div class="s">🪓</div><div class="s">⛏️</div>
    <div class="s">🪵<span class="c" id="wc">0</span></div>
    <div class="s">🪨<span class="c" id="sc">0</span></div>
    <div class="s">🧪<span class="c" id="pc">3</span></div>
  </div>
  <div id="joy"><div id="jk"></div></div>
  <div id="btns">
    <div class="b" id="ba">⚔️</div>
    <div class="b" id="bb">✋</div>
    <div class="b" id="bc">🎒</div>
  </div>
</div>
<div id="dlg"></div>
<div id="menu">
  <button class="mb" id="mr">▶️ Resumir</button>
  <button class="mb" id="ms">💾 Guardar</button>
  <button class="mb" id="ml">📂 Cargar</button>
</div>

<script>
(function(){
  'use strict';
  
  const T=32,WW=32,WH=32;
  const cv=document.getElementById('c'),ctx=cv.getContext('2d');
  
  function resize(){
    cv.width=window.innerWidth;
    cv.height=window.innerHeight;
    ctx.imageSmoothingEnabled=false;
  }
  window.addEventListener('resize',resize);
  resize();
  
  // Hash para mundo
  function h(x,y){return((x*374761393+y*668265263)^0x5bf03635)&0x7fffffff}
  
  // Mundo con biomas
  const W=[],V=[];
  for(let y=0;y<WH;y++){
    W[y]=[];V[y]=[];
    for(let x=0;x<WW;x++){
      const v=h(x,y),r=(v%1000)/1000;
      let b=0;
      if(r<0.12)b=2;
      else if(r<0.22)b=3;
      else if(r<0.4)b=6;
      else if(r<0.6)b=0;
      else if(r<0.75)b=1;
      else if(r<0.85)b=4;
      else b=5;
      W[y][x]=b;
      V[y][x]=v%4;
    }
  }
  // Suavizar biomas
  for(let i=0;i<3;i++){
    const n=W.map(r=>[...r]);
    for(let y=1;y<WH-1;y++)for(let x=1;x<WW-1;x++){
      const c={};
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const b=W[y+dy][x+dx];c[b]=(c[b]||0)+1;
      }
      let mb=0,mc=0;
      for(const b in c)if(c[b]>mc){mc=c[b];mb=b}
      if(mc>=5)n[y][x]=mb;
    }
    for(let y=0;y<WH;y++)for(let x=0;x<WW;x++)W[y][x]=n[y][x];
  }
  
  // Entidades
  const E=[];
  const AT=['deer','boar','rabbit','fox','wolf','bird','cow','sheep','pig','dog','cat','chicken','fish'];
  for(let i=0;i<10;i++){
    E.push({t:'a',a:AT[i],x:10+(h(i,100)%15)*T,y:10+(h(i,200)%15)*T,vx:0,vy:0,f:0,ft:0,hp:3,sp:80+Math.random()*40,dir:0});
  }
  E.push({t:'n',n:'Viejo',x:16*T,y:14*T,d:['Bienvenido a PachaMirai','Explora con cuidado'],dir:0,f:0,ft:0});
  E.push({t:'n',n:'Guarda',x:20*T,y:18*T,d:['Cuida la naturaleza'],dir:0,f:0,ft:0});
  E.push({t:'n',n:'Aldeana',x:24*T,y:22*T,d:['Los animales son nuestros amigos'],dir:0,f:0,ft:0});
  
  // Jugador
  const P={x:WW*T/2,y:WH*T/2,vx:0,vy:0,dir:0,f:0,st:'idle',atk:0,hp:100,mhp:100,mp:50,mmp:50,xp:0,lv:1,g:50,inv:{wood:0,stone:0,potion:3}};
  let jx=0,jy=0;
  
  // =============================================
  // DIBUJAR TILES ESTILO RPG-JS
  // =============================================
  
  // Paleta de colores RPG-JS
  const PALETTE={
    grass:['#4caf50','#388e3c','#66bb6a','#2e7d32','#81c784'],
    dirt:['#8d6e63','#6d4c41','#a1887f','#5d4037','#bcaaa4'],
    water:['#0288d1','#0277bd','#03a9f4','#01579b','#4fc3f7'],
    sand:['#f9a825','#f57f17','#fdd835','#ff8f00','#fff176'],
    stone:['#757575','#616161','#9e9e9e','#424242','#bdbdbd'],
    snow:['#fff','#e0e0e0','#f5f5f5','#bdbdbd','#fafafa'],
    tree:['#1b5e20','#2e7d32','#388e3c','#4caf50','#4e342e']
  };
  
  function drawTile(biome,variant,px,py,size){
    const colors=PALETTE[['grass','dirt','water','sand','stone','snow','tree'][biome]];
    if(!colors)return;
    
    // Color base
    ctx.fillStyle=colors[0];
    ctx.fillRect(px,py,size,size);
    
    // Textura pixel art según bioma
    const seed=biome*1000+variant*100;
    
    if(biome===0){ // Pasto
      // Base verde con variaciones
      for(let i=0;i<8;i++){
        const rx=px+((seed+i*7)%size);
        const ry=py+((seed+i*13)%size);
        ctx.fillStyle=colors[1+(i%3)];
        ctx.fillRect(rx,ry,2,2);
      }
      // Pasto alto
      ctx.fillStyle=colors[3];
      ctx.fillRect(px+4,py+28,2,4);
      ctx.fillRect(px+14,py+27,2,5);
      ctx.fillRect(px+22,py+29,2,3);
      // Flores
      if(variant===0){
        ctx.fillStyle='#ffeb3b';
        ctx.fillRect(px+8,py+8,2,2);
        ctx.fillStyle='#f44336';
        ctx.fillRect(px+20,py+12,2,2);
      }
    }
    else if(biome===1){ // Tierra
      // Base marrón con textura
      for(let i=0;i<12;i++){
        const rx=px+((seed+i*7)%size);
        const ry=py+((seed+i*13)%size);
        ctx.fillStyle=colors[1+(i%3)];
        ctx.fillRect(rx,ry,3,3);
      }
      // Piedras pequeñas
      ctx.fillStyle=colors[3];
      ctx.fillRect(px+6,py+10,3,2);
      ctx.fillRect(px+18,py+20,4,3);
    }
    else if(biome===2){ // Agua
      // Base azul con ondas
      for(let i=0;i<6;i++){
        const y=py+4+i*5;
        ctx.fillStyle=colors[2+(i%2)];
        ctx.fillRect(px+2,y,size-4,2);
      }
      // Brillos
      ctx.fillStyle=colors[4];
      ctx.fillRect(px+8,py+8,4,2);
      ctx.fillRect(px+20,py+18,3,2);
    }
    else if(biome===3){ // Arena
      // Base amarilla con granos
      for(let i=0;i<15;i++){
        const rx=px+((seed+i*5)%size);
        const ry=py+((seed+i*11)%size);
        ctx.fillStyle=colors[1+(i%3)];
        ctx.fillRect(rx,ry,2,2);
      }
      // Dunas
      ctx.fillStyle=colors[3];
      ctx.beginPath();
      ctx.arc(px+size/2,py+size,size/3,0,Math.PI,true);
      ctx.fill();
    }
    else if(biome===4){ // Piedra
      // Base gris con textura
      for(let i=0;i<10;i++){
        const rx=px+((seed+i*7)%size);
        const ry=py+((seed+i*13)%size);
        ctx.fillStyle=colors[1+(i%3)];
        ctx.fillRect(rx,ry,4,4);
      }
      // Grietas
      ctx.fillStyle=colors[3];
      ctx.fillRect(px+8,py+4,2,8);
      ctx.fillRect(px+16,py+14,2,6);
    }
    else if(biome===5){ // Nieve
      // Base blanca con brillos
      for(let i=0;i<6;i++){
        const rx=px+((seed+i*7)%size);
        const ry=py+((seed+i*13)%size);
        ctx.fillStyle=colors[1+(i%2)];
        ctx.fillRect(rx,ry,4,4);
      }
      // Montículos
      ctx.fillStyle=colors[0];
      ctx.beginPath();
      ctx.arc(px+10,py+24,6,0,Math.PI,true);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(px+22,py+20,5,0,Math.PI,true);
      ctx.fill();
    }
    else if(biome===6){ // Árbol
      // Tronco
      ctx.fillStyle='#5d4037';
      ctx.fillRect(px+12,py+16,8,16);
      ctx.fillStyle='#4e342e';
      ctx.fillRect(px+14,py+18,4,12);
      // Copa
      ctx.fillStyle='#1b5e20';
      ctx.beginPath();
      ctx.arc(px+16,py+12,12,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#2e7d32';
      ctx.beginPath();
      ctx.arc(px+14,py+10,8,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#388e3c';
      ctx.beginPath();
      ctx.arc(px+18,py+8,5,0,Math.PI*2);
      ctx.fill();
    }
    
    // Borde sutil para definir tiles
    ctx.strokeStyle='rgba(0,0,0,0.0)';
    ctx.strokeRect(px,py,size,size);
  }
  
  // =============================================
  // DIBUJAR PERSONAJE ESTILO RPG-JS
  // =============================================
  
  function drawHero(cx,cy,z,dir,frame,atk){
    const s=z*32; // tamaño total
    const bob=frame%2===0?0:-2;
    
    // Sombra
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(cx,cy+16*z,10*z,4*z,0,0,Math.PI*2);
    ctx.fill();
    
    // Posición de brazos según dirección
    const armOffset=frame%2===0?0:2;
    
    if(dir===0){ // Abajo
      // Piernas
      ctx.fillStyle='#5d4037';
      ctx.fillRect(cx-6*z,cy+4*z,5*z,10*z);
      ctx.fillRect(cx+1*z,cy+4*z,5*z,10*z);
      // Cuerpo (camisa azul)
      ctx.fillStyle='#1565c0';
      ctx.fillRect(cx-8*z,cy-8*z+armOffset,16*z,14*z);
      // Cinturón
      ctx.fillStyle='#fdd835';
      ctx.fillRect(cx-8*z,cy+2*z,16*z,3*z);
      ctx.fillStyle='#ff8f00';
      ctx.fillRect(cx-2*z,cy+2*z,4*z,3*z);
      // Cabeza
      ctx.fillStyle='#ffccbc';
      ctx.fillRect(cx-6*z,cy-16*z,12*z,10*z);
      // Pelo
      ctx.fillStyle='#5d4037';
      ctx.fillRect(cx-7*z,cy-18*z,14*z,4*z);
      ctx.fillRect(cx-7*z,cy-14*z,2*z,4*z);
      ctx.fillRect(cx+5*z,cy-14*z,2*z,4*z);
      // Ojos
      ctx.fillStyle='#fff';
      ctx.fillRect(cx-4*z,cy-12*z,3*z,3*z);
      ctx.fillRect(cx+1*z,cy-12*z,3*z,3*z);
      ctx.fillStyle='#000';
      ctx.fillRect(cx-3*z,cy-11*z,2*z,2*z);
      ctx.fillRect(cx+2*z,cy-11*z,2*z,2*z);
      // Brazos
      ctx.fillStyle='#ffccbc';
      ctx.fillRect(cx-10*z,cy-6*z+armOffset,4*z,8*z);
      ctx.fillRect(cx+6*z,cy-6*z-armOffset,4*z,8*z);
      // Espada (durante ataque)
      if(atk>0){
        ctx.fillStyle='#bdbdbd';
        ctx.fillRect(cx+10*z,cy-12*z,4*z,14*z);
        ctx.fillStyle='#fdd835';
        ctx.fillRect(cx+8*z,cy-2*z,8*z,3*z);
      }
    }
    else if(dir===1){ // Izquierda
      // Piernas
      ctx.fillStyle='#5d4037';
      ctx.fillRect(cx-4*z,cy+4*z,5*z,10*z);
      ctx.fillRect(cx-1*z,cy+4*z,5*z,10*z);
      // Cuerpo
      ctx.fillStyle='#1565c0';
      ctx.fillRect(cx-7*z,cy-8*z+armOffset,14*z,14*z);
      // Cinturón
      ctx.fillStyle='#fdd835';
      ctx.fillRect(cx-7*z,cy+2*z,14*z,3*z);
      // Cabeza
      ctx.fillStyle='#ffccbc';
      ctx.fillRect(cx-5*z,cy-16*z,11*z,10*z);
      // Pelo
      ctx.fillStyle='#5d4037';
      ctx.fillRect(cx-6*z,cy-18*z,12*z,4*z);
      // Ojo
      ctx.fillStyle='#fff';
      ctx.fillRect(cx-4*z,cy-12*z,3*z,3*z);
      ctx.fillStyle='#000';
      ctx.fillRect(cx-4*z,cy-11*z,2*z,2*z);
      // Brazos
      ctx.fillStyle='#ffccbc';
      ctx.fillRect(cx-8*z,cy-6*z+armOffset,4*z,8*z);
      ctx.fillRect(cx+4*z,cy-6*z-armOffset,4*z,8*z);
      // Espada
      if(atk>0){
        ctx.fillStyle='#bdbdbd';
        ctx.fillRect(cx-14*z,cy-8*z,14*z,4*z);
        ctx.fillStyle='#fdd835';
        ctx.fillRect(cx-6*z,cy-10*z,3*z,8*z);
      }
    }
    else if(dir===2){ // Derecha
      // Piernas
      ctx.fillStyle='#5d4037';
      ctx.fillRect(cx-4*z,cy+4*z,5*z,10*z);
      ctx.fillRect(cx-1*z,cy+4*z,5*z,10*z);
      // Cuerpo
      ctx.fillStyle='#1565c0';
      ctx.fillRect(cx-7*z,cy-8*z+armOffset,14*z,14*z);
      // Cinturón
      ctx.fillStyle='#fdd835';
      ctx.fillRect(cx-7*z,cy+2*z,14*z,3*z);
      // Cabeza
      ctx.fillStyle='#ffccbc';
      ctx.fillRect(cx-5*z,cy-16*z,11*z,10*z);
      // Pelo
      ctx.fillStyle='#5d4037';
      ctx.fillRect(cx-6*z,cy-18*z,12*z,4*z);
      // Ojo
      ctx.fillStyle='#fff';
      ctx.fillRect(cx+1*z,cy-12*z,3*z,3*z);
      ctx.fillStyle='#000';
      ctx.fillRect(cx+2*z,cy-11*z,2*z,2*z);
      // Brazos
      ctx.fillStyle='#ffccbc';
      ctx.fillRect(cx-8*z,cy-6*z+armOffset,4*z,8*z);
      ctx.fillRect(cx+4*z,cy-6*z-armOffset,4*z,8*z);
      // Espada
      if(atk>0){
        ctx.fillStyle='#bdbdbd';
        ctx.fillRect(cx+2*z,cy-8*z,14*z,4*z);
        ctx.fillStyle='#fdd835';
        ctx.fillRect(cx+4*z,cy-10*z,3*z,8*z);
      }
    }
    else if(dir===3){ // Arriba
      // Piernas
      ctx.fillStyle='#5d4037';
      ctx.fillRect(cx-6*z,cy+4*z,5*z,10*z);
      ctx.fillRect(cx+1*z,cy+4*z,5*z,10*z);
      // Cuerpo
      ctx.fillStyle='#1565c0';
      ctx.fillRect(cx-8*z,cy-8*z+armOffset,16*z,14*z);
      // Cinturón
      ctx.fillStyle='#fdd835';
      ctx.fillRect(cx-8*z,cy+2*z,16*z,3*z);
      // Cabeza
      ctx.fillStyle='#ffccbc';
      ctx.fillRect(cx-6*z,cy-16*z,12*z,10*z);
      // Pelo
      ctx.fillStyle='#5d4037';
      ctx.fillRect(cx-7*z,cy-18*z,14*z,4*z);
      ctx.fillRect(cx-7*z,cy-14*z,2*z,4*z);
      ctx.fillRect(cx+5*z,cy-14*z,2*z,4*z);
      // Sin ojos (vista desde atrás)
      // Brazos
      ctx.fillStyle='#ffccbc';
      ctx.fillRect(cx-10*z,cy-6*z+armOffset,4*z,8*z);
      ctx.fillRect(cx+6*z,cy-6*z-armOffset,4*z,8*z);
    }
  }
  
  // =============================================
  // DIBUJAR NPC ESTILO RPG-JS
  // =============================================
  
  function drawNPC(cx,cy,z,dir,frame){
    const bob=frame%2===0?0:-1;
    
    // Sombra
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(cx,cy+16*z,8*z,3*z,0,0,Math.PI*2);
    ctx.fill();
    
    // Piernas
    ctx.fillStyle='#5d4037';
    ctx.fillRect(cx-5*z,cy+4*z,4*z,10*z);
    ctx.fillRect(cx+1*z,cy+4*z,4*z,10*z);
    // Cuerpo (vestido rosa)
    ctx.fillStyle='#e91e63';
    ctx.fillRect(cx-7*z,cy-8*z+bob,14*z,14*z);
    // Cinturón
    ctx.fillStyle='#fdd835';
    ctx.fillRect(cx-7*z,cy+2*z,14*z,2*z);
    // Cabeza
    ctx.fillStyle='#ffccbc';
    ctx.fillRect(cx-5*z,cy-16*z,10*z,10*z);
    // Pelo (largo)
    ctx.fillStyle='#5d4037';
    ctx.fillRect(cx-6*z,cy-18*z,12*z,4*z);
    ctx.fillRect(cx-6*z,cy-14*z,2*z,6*z);
    ctx.fillRect(cx+4*z,cy-14*z,2*z,6*z);
    // Ojos
    ctx.fillStyle='#fff';
    ctx.fillRect(cx-3*z,cy-12*z,2*z,2*z);
    ctx.fillRect(cx+1*z,cy-12*z,2*z,2*z);
    ctx.fillStyle='#000';
    ctx.fillRect(cx-3*z,cy-11*z,1*z,1*z);
    ctx.fillRect(cx+1*z,cy-11*z,1*z,1*z);
    // Boca
    ctx.fillStyle='#f48fb1';
    ctx.fillRect(cx-1*z,cy-8*z,2*z,1*z);
    // Brazos
    ctx.fillStyle='#ffccbc';
    ctx.fillRect(cx-9*z,cy-6*z,3*z,7*z);
    ctx.fillRect(cx+6*z,cy-6*z,3*z,7*z);
  }
  
  // =============================================
  // DIBUJAR ANIMAL
  // =============================================
  
  function drawAnimal(cx,cy,z,animal,frame){
    const AC={deer:[160,120,80],boar:[80,60,40],rabbit:[240,240,240],fox:[200,80,20],wolf:[80,80,80],bird:[40,100,200],cow:[250,250,250],sheep:[250,250,240],pig:[250,180,180],horse:[120,80,60],dog:[250,250,240],cat:[200,100,50],chicken:[250,250,240],fish:[100,180,255]};
    const c=AC[animal]||[150,150,150];
    const bob=frame%2===0?0:-1;
    
    // Sombra
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(cx,cy+12*z,8*z,3*z,0,0,Math.PI*2);
    ctx.fill();
    
    // Cuerpo
    ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';
    ctx.beginPath();
    ctx.ellipse(cx,cy+4*z+bob,10*z,6*z,0,0,Math.PI*2);
    ctx.fill();
    
    // Cabeza
    ctx.beginPath();
    ctx.ellipse(cx+10*z,cy-2*z+bob,5*z,4*z,0,0,Math.PI*2);
    ctx.fill();
    
    // Orejas
    if(animal==='rabbit'||animal==='fox'){
      ctx.beginPath();
      ctx.ellipse(cx+8*z,cy-8*z,2*z,5*z,0,0,Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx+12*z,cy-8*z,2*z,5*z,0,0,Math.PI*2);
      ctx.fill();
    }
    
    // Ojo
    ctx.fillStyle='#000';
    ctx.fillRect(cx+12*z,cy-3*z+bob,2*z,2*z);
    
    // Patas
    ctx.fillStyle='rgb('+(c[0]-30)+','+(c[1]-30)+','+(c[2]-30)+')';
    const legOffset=frame%2===0?0:2;
    ctx.fillRect(cx-6*z,cy+8*z,2*z,4*z+legOffset);
    ctx.fillRect(cx-2*z,cy+8*z,2*z,4*z-legOffset);
    ctx.fillRect(cx+2*z,cy+8*z,2*z,4*z+legOffset);
    ctx.fillRect(cx+6*z,cy+8*z,2*z,4*z-legOffset);
    
    // Cola
    if(animal==='fox'||animal==='wolf'){
      ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';
      ctx.beginPath();
      ctx.ellipse(cx-12*z,cy+2*z,3*z,2*z,0.5,0,Math.PI*2);
      ctx.fill();
    }
  }
  
  // Joystick
  const joy=document.getElementById('joy');
  const knob=document.getElementById('jk');
  let active=false,joyCX=0,joyCY=0;
  
  joy.addEventListener('touchstart',function(e){
    e.preventDefault();
    active=true;
    const r=joy.getBoundingClientRect();
    joyCX=r.left+r.width/2;
    joyCY=r.top+r.height/2;
    if(e.touches[0])moveJoy(e.touches[0]);
  },{passive:false});
  
  joy.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(active&&e.touches[0])moveJoy(e.touches[0]);
  },{passive:false});
  
  joy.addEventListener('touchend',function(e){
    e.preventDefault();
    active=false;jx=0;jy=0;
    knob.style.transform='translate(-50%,-50%)';
  });
  
  function moveJoy(t){
    const dx=t.clientX-joyCX,dy=t.clientY-joyCY;
    const d=Math.min(Math.sqrt(dx*dx+dy*dy),25);
    const a=Math.atan2(dy,dx);
    knob.style.transform='translate(calc(-50% + '+Math.cos(a)*d+'px), calc(-50% + '+Math.sin(a)*d+'px))';
    jx=d>5?Math.cos(a)*d/25:0;
    jy=d>5?Math.sin(a)*d/25:0;
  }
  
  // Botones
  document.getElementById('ba').onclick=atk;
  document.getElementById('bb').onclick=int_;
  document.getElementById('bc').onclick=()=>dlg('Madera: '+P.inv.wood+' | Piedra: '+P.inv.stone);
  document.getElementById('mr').onclick=()=>document.getElementById('menu').style.display='none';
  document.getElementById('ms').onclick=()=>{localStorage.setItem('p',JSON.stringify(P));dlg('Guardado')};
  document.getElementById('ml').onclick=()=>{const s=localStorage.getItem('p');if(s){Object.assign(P,JSON.parse(s));dlg('Cargado')}else dlg('Sin partida')};
  
  function atk(){if(P.atk>0)return;P.atk=0.4;P.st='attack';for(let i=E.length-1;i>=0;i--){const e=E[i];if(e.t!=='a')continue;if(Math.hypot(e.x-P.x,e.y-P.y)<40){e.hp--;if(e.hp<=0){P.xp+=10;E.splice(i,1);dlg('+10 XP')}}}}
  function int_(){for(const e of E)if(e.t==='n'&&Math.hypot(e.x-P.x,e.y-P.y)<50){dlg(e.n+': '+e.d[Math.floor(Math.random()*e.d.length)]);return}}
  function dlg(t){const d=document.getElementById('dlg');d.textContent=t;d.style.display='block';setTimeout(()=>d.style.display='none',2000)}
  
  // =============================================
  // RENDER
  // =============================================
  function render(){
    const w=cv.width,h=cv.height;
    const z=2,ts=T*z;
    const cx=w/2,cy=h/2;
    
    // Fondo
    ctx.fillStyle='#1a3a1a';
    ctx.fillRect(0,0,w,h);
    
    // Calcular rango de tiles visibles
    const sx=Math.max(0,Math.floor(P.x/T)-Math.ceil(w/ts/2)-2);
    const sy=Math.max(0,Math.floor(P.y/T)-Math.ceil(h/ts/2)-2);
    const ex=Math.min(WW,Math.ceil(P.x/T)+Math.ceil(w/ts/2)+4);
    const ey=Math.min(WH,Math.ceil(P.y/T)+Math.ceil(h/ts/2)+4);
    
    // Dibujar tiles
    for(let ty=sy;ty<ey;ty++){
      for(let tx=sx;tx<ex;tx++){
        const biome=W[ty][tx];
        const v=V[ty][tx];
        const px=cx+(tx*T-P.x)*z;
        const py=cy+(ty*T-P.y)*z;
        drawTile(biome,v,px,py,ts);
      }
    }
    
    // Dibujar entidades
    for(const e of E){
      const esx=cx+(e.x-P.x)*z;
      const esy=cy+(e.y-P.y)*z;
      if(esx<-50||esx>cv.width+50||esy<-50||esy>cv.height+50)continue;
      
      if(e.t==='a'){
        drawAnimal(esx,esy,z,e.a,e.f);
      } else {
        drawNPC(esx,esy,z,e.dir,e.f);
        ctx.fillStyle='#fc0';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText(e.n,esx,esy-20*z);
      }
    }
    
    // Dibujar jugador
    drawHero(cx,cy,z,P.dir,P.f,P.atk>0);
  }
  
  // Minimapa
  function renderMM(){
    const mc=document.getElementById('mc');if(!mc)return;
    const mctx=mc.getContext('2d');
    mctx.fillStyle='#1a1a2e';mctx.fillRect(0,0,40,40);
    const r=12,ppx=Math.floor(P.x/T),ppy=Math.floor(P.y/T);
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      const wx=ppx+dx,wy=ppy+dy;if(wx<0||wx>=WW||wy<0||wy>=WH)continue;
      const t=W[wy][wx];
      mctx.fillStyle=t===0?'#4caf50':t===1?'#8d6e63':t===2?'#0288d1':t===3?'#f9a825':t===4?'#757575':t===5?'#fff':'#1b5e20';
      mctx.fillRect(20+dx*1.5,20+dy*1.5,1.5,1.5);
    }
    mctx.fillStyle='#fff';mctx.fillRect(19,19,2,2);
    mctx.fillStyle='#fc0';
    for(const e of E)if(e.t==='n'){const nx=20+Math.floor((e.x/T-ppx)*1.5),ny=20+Math.floor((e.y/T-ppy)*1.5);if(nx>0&&nx<40&&ny>0&&ny<40)mctx.fillRect(nx-1,ny-1,3,3)}
  }
  
  // Update
  function update(dt){
    const sp=80;
    P.vx=jx*sp;P.vy=jy*sp;
    P.x+=P.vx*dt;P.y+=P.vy*dt;
    P.x=Math.max(T,Math.min(WW*T-T,P.x));
    P.y=Math.max(T,Math.min(WH*T-T,P.y));
    
    if(Math.abs(jx)>Math.abs(jy))P.dir=jx>0?2:1;
    else if(jy!==0)P.dir=jy>0?0:3;
    
    if(P.atk>0){P.st='attack';P.atk-=dt}
    else if(Math.abs(P.vx)>1||Math.abs(P.vy)>1)P.st='walk';
    else P.st='idle';
    
    P.ft+=dt;if(P.ft>0.4){P.ft=0;P.f=(P.f+1)%4}
    
    for(const e of E){
      if(e.t!=='a')continue;
      const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy);
      if(d<80&&d>0){e.vx=-dx/d*60;e.vy=-dy/d*120}
      else if(d>200){e.vx=(Math.random()-0.5)*40;e.vy=(Math.random()-0.5)*40}
      else{e.vx*=0.95;e.vy*=0.95}
      e.x+=e.vx*dt;e.y+=e.vy*dt;
      e.x=Math.max(T,Math.min(WW*T-T,e.x));
      e.y=Math.max(T,Math.min(WH*T-T,e.y));
      e.ft+=dt;if(e.ft>0.2){e.ft=0;e.f=(e.f+1)%4}
      if(Math.abs(e.vx)>Math.abs(e.vy))e.dir=e.vx>0?2:1;
      else if(e.vy!==0)e.dir=e.vy>0?0:3;
    }
    
    if(P.xp>=P.lv*50){P.xp-=P.lv*50;P.lv++;P.mhp+=10;P.hp=P.mhp;dlg('NIVEL '+P.lv+'!')}
    
    // Actualizar HUD
    document.getElementById('hp-fill').style.width=(P.hp/P.mhp*100)+'%';
    document.getElementById('mp-fill').style.width=(P.mp/P.mmp*100)+'%';
    document.getElementById('xp-fill').style.width=(P.xp/(P.lv*50)*100)+'%';
    document.getElementById('hp-txt').textContent=P.hp+'/'+P.mhp;
    document.getElementById('mp-txt').textContent=P.mp+'/'+P.mmp;
    document.getElementById('xp-txt').textContent=P.xp+'/'+(P.lv*50);
    document.getElementById('lvl').textContent='Nv '+P.lv;
    document.getElementById('g').textContent='🪙 '+P.g;
    document.getElementById('wc').textContent=P.inv.wood;
    document.getElementById('sc').textContent=P.inv.stone;
    document.getElementById('pc').textContent=P.inv.potion;
  }
  
  // Game loop
  let last=0;
  function loop(ts){
    const dt=Math.min((ts-last)/1000,0.1);
    last=ts;
    update(dt);
    render();
    renderMM();
    requestAnimationFrame(loop);
  }
  
  // Iniciar
  last=performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
