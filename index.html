<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PachaMirai</title>
<style>
*{margin:0;padding:0;touch-action:none;user-select:none;image-rendering:pixelated}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:monospace}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#ui>div{pointer-events:auto}
#hud{position:absolute;top:0;left:0;right:0;height:36px;background:rgba(0,0,0,0.85);border-bottom:2px solid #333;display:flex;align-items:center;justify-content:space-between;padding:0 6px;color:#fff;font-size:10px}
.bar-bg{width:50px;height:6px;background:#222;border:1px solid #444;overflow:hidden}
.bar-fill{height:100%}
#mm{width:40px;height:40px;background:#111;border:2px solid #444;overflow:hidden;image-rendering:pixelated}
#mm canvas{width:100%;height:100%}
#hb{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:1px;background:rgba(0,0,0,0.8);padding:3px;border:2px solid #444}
.s{width:30px;height:30px;background:#222;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative}
.s .c{position:absolute;bottom:0;right:1px;font-size:7px;color:#ff0}
#joy{position:absolute;bottom:50px;left:30px;width:90px;height:90px;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.3);border-radius:50%;touch-action:none}
#jk{position:absolute;top:50%;left:50%;width:36px;height:36px;background:rgba(255,255,255,0.4);border-radius:50%;transform:translate(-50%,-50%)}
#btns{position:absolute;bottom:50px;right:30px;display:flex;flex-direction:column;gap:8px}
.b{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;touch-action:none}
#dlg{display:none;position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;padding:8px 14px;border:2px solid #666;font-size:11px;max-width:80%}
#menu{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.mb{width:160px;padding:10px;background:#222;border:2px solid #666;color:#fff;font-size:14px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="hud">
    <div style="display:flex;align-items:center;gap:6px">
      <div>HP <span id="hp-txt">100/100</span><div class="bar-bg"><div class="bar-fill" id="hp-fill" style="width:100%;background:#e44"></div></div></div>
      <div>MP <span id="mp-txt">50/50</span><div class="bar-bg"><div class="bar-fill" id="mp-fill" style="width:100%;background:#48f"></div></div></div>
      <div>XP <span id="xp-txt">0/50</span><div class="bar-bg"><div class="bar-fill" id="xp-fill" style="width:0%;background:#fc0"></div></div></div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <span id="lvl">Nv 1</span>
      <span id="g">🪙 50</span>
      <div id="mm"><canvas id="mc" width="40" height="40"></canvas></div>
    </div>
  </div>
  <div id="hb">
    <div class="s">⚔️</div><div class="s">🪓</div><div class="s">⛏️</div>
    <div class="s">🪵<span class="c" id="wc">0</span></div>
    <div class="s">🪨<span class="c" id="sc">0</span></div>
    <div class="s">🧪<span class="c" id="pc">3</span></div>
  </div>
  <div id="joy"><div id="jk"></div></div>
  <div id="btns">
    <div class="b" id="ba">⚔️</div>
    <div class="b" id="bb">✋</div>
    <div class="b" id="bc">🎒</div>
  </div>
</div>
<div id="dlg"></div>
<div id="menu">
  <button class="mb" id="mr">▶️ Resumir</button>
  <button class="mb" id="ms">💾 Guardar</button>
  <button class="mb" id="ml">📂 Cargar</button>
</div>

  for(const k in TILE_DATA){
    ASSETS.tiles[k]=new Image();
    ASSETS.tiles[k].src="data:image/png;base64,"+TILE_DATA[k];
  }
  
  for(const k in HERO_DATA){
    ASSETS.hero[k]=new Image();
    ASSETS.hero[k].src="data:image/png;base64,"+HERO_DATA[k];
  }
  
  // Joystick
  const joy=document.getElementById('joy');
  const knob=document.getElementById('jk');
  let active=false,joyCX=0,joyCY=0;
  
  joy.addEventListener('touchstart',function(e){e.preventDefault();active=true;const r=joy.getBoundingClientRect();joyCX=r.left+r.width/2;joyCY=r.top+r.height/2;e.touches[0]&&moveJoy(e.touches[0])},{passive:false});
  joy.addEventListener('touchmove',function(e){e.preventDefault();if(active&&e.touches[0])moveJoy(e.touches[0])},{passive:false});
  joy.addEventListener('touchend',function(e){e.preventDefault();active=false;jx=0;jy=0;knob.style.transform='translate(-50%,-50%)'});
  
  function moveJoy(t){
    const dx=t.clientX-joyCX,dy=t.clientY-joyCY;
    const d=Math.min(Math.sqrt(dx*dx+dy*dy),25);
    const a=Math.atan2(dy,dx);
    knob.style.transform='translate(calc(-50% + '+Math.cos(a)*d+'px), calc(-50% + '+Math.sin(a)*d+'px))';
    jx=d>5?Math.cos(a)*d/25:0;
    jy=d>5?Math.sin(a)*d/25:0;
  }
  
  // Botones
  document.getElementById('ba').onclick=atk;
  document.getElementById('bb').onclick=int_;
  document.getElementById('bc').onclick=()=>dlg('Madera: '+P.inv.wood+' | Piedra: '+P.inv.stone);
  document.getElementById('mr').onclick=()=>document.getElementById('menu').style.display='none';
  document.getElementById('ms').onclick=()=>{localStorage.setItem('p',JSON.stringify(P));dlg('Guardado')};
  document.getElementById('ml').onclick=()=>{const s=localStorage.getItem('p');if(s){Object.assign(P,JSON.parse(s));dlg('Cargado')}else dlg('Sin partida')};
  
  function atk(){if(P.atk>0)return;P.atk=0.4;P.st='attack';for(let i=E.length-1;i>=0;i--){const e=E[i];if(e.t!=='a')continue;if(Math.hypot(e.x-P.x,e.y-P.y)<40){e.hp--;if(e.hp<=0){P.xp+=10;E.splice(i,1);dlg('+10 XP')}}}}
  function int_(){for(const e of E)if(e.t==='n'&&Math.hypot(e.x-P.x,e.y-P.y)<50){dlg(e.n+': '+e.d[Math.floor(Math.random()*e.d.length)]);return}}
  function dlg(t){const d=document.getElementById('dlg');d.textContent=t;d.style.display='block';setTimeout(()=>d.style.display='none',2000)}
  
  // Render
  function render(){
    const w=cv.width,h=cv.height;
    const z=2,ts=T*z;
    const cx=w/2,cy=h/2;
    
    ctx.fillStyle='#1a1a2e';
    ctx.fillRect(0,0,w,h);
    
    // Tiles
    const sx=Math.max(0,Math.floor(P.x/T)-Math.ceil(w/ts/2)-2);
    const sy=Math.max(0,Math.floor(P.y/T)-Math.ceil(h/ts/2)-2);
    const ex=Math.min(WW,Math.ceil(P.x/T)+Math.ceil(w/ts/2)+2);
    const ey=Math.min(WH,Math.ceil(P.y/T)+Math.ceil(h/ts/2)+2);
    
    const biomeNames=['grass','dirt','water','sand','stone','snow','tree'];
    
    for(let ty=sy;ty<ey;ty++)for(let tx=sx;tx<ex;tx++){
      const biome=W[ty][tx];
      const v=V[ty][tx];
      const name=biomeNames[biome]+'_'+v;
      
      const px=cx+(tx*T-P.x)*z;
      const py=cy+(ty*T-P.y)*z;
      
      if(ASSETS.tiles[name]&&ASSETS.tiles[name].complete&&ASSETS.tiles[name].naturalWidth>0){
        ctx.drawImage(ASSETS.tiles[name],px,py,ts,ts);
      } else {
        const cs=['#3a6b2a','#5d4037','#0d47a1','#f9a825','#616161','#e0e0e0','#2d5a2d'];
        ctx.fillStyle=cs[biome]||'#f0f';
        ctx.fillRect(px,py,ts+1,ts+1);
      }
    }
    
    // Jugador con sprite RPG-JS
    const dirNames=['dir0','dir1','dir2','dir3'];
    const dirKey=dirNames[P.dir];
    const frameNum=P.st==='walk'?P.f%4:0;
    const spriteKey='hero_'+dirKey+'_f'+frameNum;
    
    if(ASSETS.hero[spriteKey]&&ASSETS.hero[spriteKey].complete&&ASSETS.hero[spriteKey].naturalWidth>0){
      ctx.drawImage(ASSETS.hero[spriteKey],cx-16*z,cy-16*z,32*z,32*z);
    } else {
      ctx.fillStyle='#e44';
      ctx.fillRect(cx-16,cy-16,32,32);
    }
    
    // Entidades
    const AC={deer:[160,120,80],boar:[80,60,40],rabbit:[240,240,240],fox:[200,80,20],wolf:[80,80,80],bird:[40,100,200],cow:[250,250,250],sheep:[250,250,240],pig:[250,180,180],horse:[120,80,60],dog:[250,250,240],cat:[200,100,50],chicken:[250,250,240],fish:[100,180,255]};
    for(const e of E){
      const esx=cx+(e.x-P.x)*z,esy=cy+(e.y-P.y)*z;
      if(esx<-50||esx>w+50||esy<-50||esy>h+50)continue;
      
      if(e.t==='a'){
        const c=AC[e.a]||[150,150,150];
        ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';
        ctx.beginPath();ctx.ellipse(esx+14*z,esy+18*z,10*z,6*z,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(esx+24*z,esy+10*z,6*z,5*z,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#212121';ctx.fillRect(esx+26*z,esy+9*z,2*z,2*z);
      } else {
        ctx.fillStyle='#795548';ctx.fillRect(esx+6*z,esy+2*z,20*z,10*z);ctx.fillRect(esx+10*z,esy,12*z,4*z);
        ctx.fillStyle='#ffccbc';ctx.fillRect(esx+8*z,esy+10*z,16*z,10*z);
        ctx.fillStyle='#1565c0';ctx.fillRect(esx+6*z,esy+18*z,20*z,12*z);
        ctx.fillStyle='#fc0';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText(e.n,esx+16*z,esy-4*z);
      }
    }
  }
  
  // Minimapa
  function renderMM(){
    const mc=document.getElementById('mc');if(!mc)return;
    const mctx=mc.getContext('2d');
    mctx.fillStyle='#1a1a2e';mctx.fillRect(0,0,40,40);
    const r=12,ppx=Math.floor(P.x/T),ppy=Math.floor(P.y/T);
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      const wx=ppx+dx,wy=ppy+dy;if(wx<0||wx>=WW||wy<0||wy>=WH)continue;
      const t=W[wy][wx];
      mctx.fillStyle=t===0?'#4caf50':t===1?'#8d6e63':t===2?'#0288d1':t===3?'#f9a825':t===4?'#757575':t===5?'#fff':'#1b5e20';
      mctx.fillRect(20+dx*1.5,20+dy*1.5,1.5,1.5);
    }
    mctx.fillStyle='#fff';mctx.fillRect(19,19,2,2);
    mctx.fillStyle='#fc0';
    for(const e of E)if(e.t==='n'){const nx=20+Math.floor((e.x/T-ppx)*1.5),ny=20+Math.floor((e.y/T-ppy)*1.5);if(nx>0&&nx<40&&ny>0&&ny<40)mctx.fillRect(nx-1,ny-1,3,3)}
  }
  
  // Update
  function update(dt){
    const sp=150;
    P.vx=jx*sp;P.vy=jy*sp;
    P.x+=P.vx*dt;P.y+=P.vy*dt;
    P.x=Math.max(T,Math.min(WW*T-T,P.x));
    P.y=Math.max(T,Math.min(WH*T-T,P.y));
    
    if(Math.abs(jx)>Math.abs(jy))P.dir=jx>0?2:1;else if(jy!==0)P.dir=jy>0?0:3;
    
    if(P.atk>0){P.st='attack';P.atk-=dt}else if(Math.abs(P.vx)>1||Math.abs(P.vy)>1)P.st='walk';else P.st='idle';
    P.ft+=dt;if(P.ft>0.2){P.ft=0;P.f=(P.f+1)%4}
    
    for(const e of E){
      if(e.t!=='a')continue;
      const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy);
      if(d<80&&d>0){e.vx=-dx/d*120;e.vy=-dy/d*120}
      else if(d>200){e.vx=(Math.random()-0.5)*40;e.vy=(Math.random()-0.5)*40}
      else{e.vx*=0.95;e.vy*=0.95}
      e.x+=e.vx*dt;e.y+=e.vy*dt;
      e.x=Math.max(T,Math.min(WW*T-T,e.x));
      e.y=Math.max(T,Math.min(WH*T-T,e.y));
    }
    
    if(P.xp>=P.lv*50){P.xp-=P.lv*50;P.lv++;P.mhp+=10;P.hp=P.mhp;dlg('NIVEL '+P.lv+'!')}
    
    document.getElementById('hp-fill').style.width=(P.hp/P.mhp*100)+'%';
    document.getElementById('mp-fill').style.width=(P.mp/P.mmp*100)+'%';
    document.getElementById('xp-fill').style.width=(P.xp/(P.lv*50)*100)+'%';
    document.getElementById('hp-txt').textContent=P.hp+'/'+P.mhp;
    document.getElementById('mp-txt').textContent=P.mp+'/'+P.mmp;
    document.getElementById('xp-txt').textContent=P.xp+'/'+(P.lv*50);
    document.getElementById('lvl').textContent='Nv '+P.lv;
    document.getElementById('g').textContent='🪙 '+P.g;
    document.getElementById('wc').textContent=P.inv.wood;
    document.getElementById('sc').textContent=P.inv.stone;
    document.getElementById('pc').textContent=P.inv.potion;
  }
  
  let last=0;
  function loop(ts){const dt=Math.min((ts-last)/1000,0.1);last=ts;update(dt);render();renderMM();requestAnimationFrame(loop)}
  
  last=performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
