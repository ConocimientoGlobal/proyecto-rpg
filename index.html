<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PachaMirai</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;image-rendering:pixelated}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'Courier New',monospace}
canvas{display:block;position:absolute;top:0;left:0;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#ui>div{pointer-events:auto}

/* ========== HUD PIXEL ART ========== */
#hud-top{
  position:absolute;top:0;left:0;right:0;height:48px;
  background:#1a1a2e;
  border-bottom:3px solid #4a4a6a;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;
}
.hud-section{display:flex;align-items:center;gap:8px}
.hud-item{
  color:#e0e0ff;font-size:11px;
  text-shadow:1px 1px 0 #000;
  padding:4px 8px;
  background:#2a2a4a;
  border:2px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#1a1a2e;border-right-color:#1a1a2e;
}
.bar-bg{
  width:80px;height:10px;
  background:#1a1a2e;border:2px solid #4a4a6a;
  box-shadow:inset 1px 1px 0 #0a0a1a;
  overflow:hidden;
}
.bar-fill{height:100%;transition:width 0.2s}
#hp-fill{background:#e44}
#mp-fill{background:#48f}
#xp-fill{background:#fc0}

#minimap{
  width:64px;height:64px;
  background:#1a1a2e;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#1a1a2e;border-right-color:#1a1a2e;
  overflow:hidden;position:relative;
}
#minimap canvas{width:100%;height:100%;image-rendering:pixelated}

/* ========== HOTBAR ========== */
#hotbar{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  display:flex;gap:2px;
  background:#1a1a2e;padding:4px;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#0a0a1a;border-right-color:#0a0a1a;
}
.slot{
  width:36px;height:36px;
  background:#2a2a4a;
  border:2px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#1a1a2e;border-right-color:#1a1a2e;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;position:relative;
}
.slot:active,.slot.active{
  background:#3a3a5a;
  border-top-color:#1a1a2e;border-left-color:#1a1a2e;
  border-bottom-color:#6a6a8a;border-right-color:#6a6a8a;
}
.slot .count{
  position:absolute;bottom:0;right:1px;
  font-size:7px;color:#fc0;text-shadow:1px 1px 0 #000;
}

/* ========== CONTROLES ========== */
#joystick{
  position:absolute;bottom:60px;left:30px;
  width:100px;height:100px;
  background:#2a2a4a;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#1a1a2e;border-right-color:#1a1a2e;
  border-radius:50%;touch-action:none;
}
#joy-knob{
  position:absolute;top:50%;left:50%;
  width:40px;height:40px;
  background:#5a5a8a;
  border:2px solid #8a8abd;
  border-top-color:#aacbff;border-left-color:#aacbff;
  border-bottom-color:#3a3a6a;border-right-color:#3a3a6a;
  border-radius:50%;transform:translate(-50%,-50%);
  pointer-events:none;
}

#action-btns{
  position:absolute;bottom:60px;right:30px;
  display:flex;flex-direction:column;gap:8px;
}
.abtn{
  width:48px;height:48px;border-radius:50%;
  background:#2a2a4a;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#1a1a2e;border-right-color:#1a1a2e;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;touch-action:none;
}
.abtn:active{
  background:#3a3a5a;
  border-top-color:#1a1a2e;border-left-color:#1a1a2e;
  border-bottom-color:#6a6a8a;border-right-color:#6a6a8a;
}

/* ========== DIÁLOGO ========== */
#dialogue{
  display:none;position:absolute;bottom:80px;left:50%;
  transform:translateX(-50%);
  background:#1a1a2e;color:#e0e0ff;
  padding:10px 16px;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#0a0a1a;border-right-color:#0a0a1a;
  font-size:12px;max-width:90%;text-align:center;
  text-shadow:1px 1px 0 #000;
  box-shadow:3px 3px 0 #0a0a1a;
}

/* ========== MENÚ ========== */
#menu{
  display:none;position:fixed;top:0;left:0;
  width:100%;height:100%;
  background:rgba(10,10,20,0.95);z-index:100;
  align-items:center;justify-content:center;
  flex-direction:column;gap:10px;
}
.mbtn{
  width:180px;padding:10px;
  background:#2a2a4a;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#1a1a2e;border-right-color:#1a1a2e;
  color:#e0e0ff;font-size:14px;text-align:center;
  font-family:inherit;text-shadow:1px 1px 0 #000;
}
.mbtn:active{
  background:#3a3a5a;
  border-top-color:#1a1a2e;border-left-color:#1a1a2e;
  border-bottom-color:#6a6a8a;border-right-color:#6a6a8a;
}

/* ========== INVENTARIO ========== */
#inventory{
  display:none;position:fixed;top:0;left:0;
  width:100%;height:100%;
  background:rgba(10,10,20,0.95);z-index:100;
  align-items:center;justify-content:center;flex-direction:column;
}
#inv-grid{
  display:grid;grid-template-columns:repeat(5,40px);gap:3px;
  background:#1a1a2e;padding:8px;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#0a0a1a;border-right-color:#0a0a1a;
}
.inv-slot{
  width:40px;height:40px;
  background:#2a2a4a;
  border:2px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#1a1a2e;border-right-color:#1a1a2e;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;position:relative;
}
.inv-slot .count{
  position:absolute;bottom:0;right:1px;font-size:7px;color:#fc0;
}
#inv-close{
  margin-top:10px;width:120px;padding:8px;
  background:#2a2a4a;color:#e0e0ff;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#1a1a2e;border-right-color:#1a1a2e;
  font-size:13px;
}

/* ========== MENSAJES ========== */
.float-msg{
  position:absolute;font-size:11px;color:#ffcc00;
  pointer-events:none;text-shadow:1px 1px 0 #000;
  animation:floatUp 1.5s forwards;
}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <!-- HUD Superior -->
  <div id="hud-top">
    <div class="hud-section">
      <div class="hud-item">
        <div>HP <span id="hp-txt">100/100</span></div>
        <div class="bar-bg"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div>
      </div>
      <div class="hud-item">
        <div>MP <span id="mp-txt">50/50</span></div>
        <div class="bar-bg"><div class="bar-fill" id="mp-fill" style="width:100%"></div></div>
      </div>
      <div class="hud-item">
        <div>XP <span id="xp-txt">0/50</span></div>
        <div class="bar-bg"><div class="bar-fill" id="xp-fill" style="width:0%"></div></div>
      </div>
    </div>
    <div class="hud-section">
      <div class="hud-item" id="lvl-display">Nv 1</div>
      <div class="hud-item" id="gold-display">🪙 50</div>
      <div id="minimap"><canvas id="mc" width="64" height="64"></canvas></div>
    </div>
  </div>

  <!-- Hotbar -->
  <div id="hotbar">
    <div class="slot active" data-slot="0">⚔️</div>
    <div class="slot" data-slot="1">🪓</div>
    <div class="slot" data-slot="2">⛏️</div>
    <div class="slot" data-slot="3">🌱</div>
    <div class="slot" data-slot="4">🪵<span class="count">0</span></div>
    <div class="slot" data-slot="5">🪨<span class="count">0</span></div>
    <div class="slot" data-slot="6">🧪<span class="count">0</span></div>
    <div class="slot" data-slot="7">🍎<span class="count">0</span></div>
  </div>

  <!-- Joystick -->
  <div id="joystick"><div id="joy-knob"></div></div>

  <!-- Botones de acción -->
  <div id="action-btns">
    <div class="abtn" id="btn-atk">⚔️</div>
    <div class="abtn" id="btn-act">✋</div>
    <div class="abtn" id="btn-inv">🎒</div>
  </div>
</div>

<!-- Diálogo -->
<div id="dialogue"></div>

<!-- Menú -->
<div id="menu">
  <button class="mbtn" id="m-resume">▶️ Resumir</button>
  <button class="mbtn" id="m-save">💾 Guardar</button>
  <button class="mbtn" id="m-load">📂 Cargar</button>
  <button class="mbtn" id="m-menu">🚪 Menú Principal</button>
</div>

<!-- Inventario -->
<div id="inventory">
  <div id="inv-grid"></div>
  <button id="inv-close">Cerrar [E]</button>
</div>

<script src="game.js"></script>
</body>
</html>
