<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PachaMirai</title>
<style>
body{margin:0;padding:0;overflow:hidden;background:#1a3a1a;font-family:monospace}
canvas{display:block;position:fixed;top:0;left:0}
#ui{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none}
#stats{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.7);color:#fff;padding:8px;border-radius:4px;font-size:11px;min-width:90px}
.bar{width:80px;height:6px;background:#333;margin:3px 0;border-radius:2px}
.bar div{height:100%;border-radius:2px}
.hp{background:red}
.mp{background:blue}
.xp{background:yellow}
#controls{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(0,0,0,0.7);padding:4px;border-radius:4px}
.slot{width:28px;height:28px;background:rgba(255,255,255,0.1);border:1px solid #555;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:12px}
#joy{position:absolute;bottom:60px;left:50px;width:80px;height:80px;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);border-radius:50%;pointer-events:auto}
#joy-knob{position:absolute;top:50%;left:50%;width:30px;height:30px;background:rgba(255,255,255,0.4);border-radius:50%;transform:translate(-50%,-50%)}
#btns{position:absolute;bottom:60px;right:50px;display:flex;gap:8px}
.btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:18px;pointer-events:auto;color:#fff}
#dlg{display:none;position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 16px;border-radius:6px;font-size:12px}
#menu{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.9);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.mbtn{width:160px;padding:10px;background:#333;border:1px solid #666;border-radius:6px;color:#fff;font-size:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="stats">
    <div>HP <div class="bar"><div class="hp" id="hp" style="width:100%"></div></div></div>
    <div>MP <div class="bar"><div class="mp" id="mp" style="width:100%"></div></div></div>
    <div>XP <div class="bar"><div class="xp" id="xp" style="width:0%"></div></div></div>
    <div id="gold">🪙 50</div>
  </div>
  <div id="controls">
    <div class="slot">⚔️</div><div class="slot">✋</div><div class="slot">🎒</div>
    <div class="slot">🌾</div><div class="slot">⛏️</div><div class="slot">🪓</div>
    <div class="slot">🧪</div><div class="slot">🍎</div><div class="slot">💎</div><div class="slot">🪵</div>
  </div>
  <div id="joy"><div id="joy-knob"></div></div>
  <div id="btns">
    <div class="btn" id="atk">⚔️</div>
    <div class="btn" id="int">✋</div>
  </div>
</div>
<div id="dlg"></div>
<div id="menu">
  <button class="mbtn" id="m1">▶️ Resumir</button>
  <button class="mbtn" id="m2">💾 Guardar</button>
  <button class="mbtn" id="m3">📂 Cargar</button>
  <button class="mbtn" id="m4">🚪 Salir</button>
</div>
<script>
const T=32,VW=800,VH=450,WW=128,WH=128;
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,SCALE=1;

function resize(){
  W=innerWidth;H=innerHeight;
  SCALE=Math.max(1,Math.floor(Math.min(W/VW,H/VH)));
  c.width=VW*SCALE;c.height=VH*SCALE;
  c.style.width=(VW*SCALE)+'px';c.style.height=(VH*SCALE)+'px';
  c.style.left=((W-VW*SCALE)/2)+'px';c.style.top=((H-VH*SCALE)/2)+'px';
  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  ctx.imageSmoothingEnabled=false;
}

function hsh(x,y){return ((x*374761393+y*668265263)^0x5bf03635)&0x7fffffff}

const world=[],vars=[];
for(let y=0;y<WH;y++){world[y]=[];vars[y]=[];for(let x=0;x<WW;x++){const v=hsh(x,y),r=(v%1000)/1000;let b=0;if(r<0.1)b=2;else if(r<0.2)b=3;else if(r<0.4)b=6;else if(r<0.6)b=0;else if(r<0.75)b=1;else if(r<0.85)b=4;else b=5;world[y][x]=b;vars[y][x]=v%4}}
for(let i=0;i<4;i++){const n=world.map(r=>[...r]);for(let y=1;y<WH-1;y++)for(let x=1;x<WW-1;x++){const c={};for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const b=world[y+dy][x+dx];c[b]=(c[b]||0)+1}let mb=0,mc=0;for(const b in c){if(c[b]>mc){mc=c[b];mb=b}}if(mc>=5)n[y][x]=mb}for(let y=0;y<WH;y++)for(let x=0;x<WW;x++)world[y][x]=n[y][x]}

const entities=[];
const at=['deer','boar','rabbit','fox','wolf','bird','cow','sheep','pig','horse','dog','cat','chicken','fish'];
for(let i=0;i<16;i++)entities.push({t:'a',a:at[i%14],x:30+(hsh(i,100)%80)*T,y:30+(hsh(i,200)%80)*T,vx:0,vy:0,f:0,s:'idle',hp:3,sp:0.3+Math.random()*0.3});
entities.push({t:'n',name:'Viejo',x:50*T,y:45*T,d:['Bienvenido!','Explora con cuidado']});
entities.push({t:'n',name:'Guarda',x:70*T,y:60*T,d:['Cuida la naturaleza']});

const P={x:WW*T/2,y:WH*T/2,vx:0,vy:0,dir:0,f:0,ft:0,st:'idle',atk:0,hp:100,mhp:100,mp:50,mmp:50,xp:0,lv:1,g:50};

let jx=0,jy=0,ja=false,jx2=0,jy2=0,jid=null;
const keys={};

c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];if(t.clientX<W*0.5){ja=true;jid=t.identifier;jx2=t.clientX;jy2=t.clientY;jx=0;jy=0}},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(!ja)return;for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i];if(t.identifier===jid){const dx=t.clientX-jx2,dy=t.clientY-jy2;const d=Math.sqrt(dx*dx+dy*dy),m=30;if(d>m){jx=dx*m/d;jy=dy*m/d}else{jx=dx/m;jy=dy/m}}}},{passive:false});
c.addEventListener('touchend',e=>{for(let i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===jid){ja=false;jx=0;jy=0;jid=null}}},{passive:false});
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='Escape'){const m=document.getElementById('menu');m.style.display=m.style.display==='flex'?'none':'flex'}});
addEventListener('keyup',e=>{keys[e.key]=false});

function atk(){if(P.atk>0)return;P.atk=0.5;P.st='attack';for(let i=entities.length-1;i>=0;i--){const e=entities[i];if(e.t!=='a')continue;const dx=e.x-P.x,dy=e.y-P.y;if(Math.sqrt(dx*dx+dy*dy)<40){e.hp--;if(e.hp<=0){P.xp+=5;entities.splice(i,1)}}}}
function interact(){for(const e of entities){if(e.t==='n'){const dx=e.x-P.x,dy=e.y-P.y;if(Math.sqrt(dx*dx+dy*dy)<50){dlg(e.name+': '+e.d[Math.floor(Math.random()*e.d.length)]);return}}}}

function dlg(t){const d=document.getElementById('dlg');d.textContent=t;d.style.display='block';setTimeout(()=>d.style.display='none',2500)}

document.getElementById('m1').onclick=()=>{document.getElementById('menu').style.display='none'};
document.getElementById('m2').onclick=()=>{localStorage.setItem('p',JSON.stringify(P));dlg('Guardado')};
document.getElementById('m3').onclick=()=>{const s=localStorage.getItem('p');if(s){Object.assign(P,JSON.parse(s));dlg('Cargado')}else dlg('Sin partida')};
document.getElementById('m4').onclick=()=>{document.getElementById('menu').style.display='none'};

function drawTile(t,x,y,v){
  const cs=[['#3a6b2a','#4a7c2e','#387328','#48802c'],['#5d4037','#6d4c41','#4e342e','#795548'],['#0d47a1','#1565c0','#1565c0','#0d47a1'],['#f9a825','#f9a825','#c97c1a','#f9a825'],['#616161','#757575','#9e9e9e','#616161'],['#e0e0e0','#ffffff','#e0e0e0','#ffffff'],['#2d5a2d','#2d5a2d','#2d5a2d','#2d5a2d']];
  ctx.fillStyle=cs[t][v];ctx.fillRect(x,y,T,T);
  if(t===0){ctx.fillStyle='#5a9a3a';ctx.fillRect(x+4,y+26,2,6);ctx.fillRect(x+14,y+25,2,7);ctx.fillRect(x+24,y+27,2,5)}
  if(t===2){ctx.fillStyle='#42a5f5';ctx.fillRect(x+4,y+8,8,2);ctx.fillRect(x+16,y+16,6,2)}
  if(t===6){ctx.fillStyle='#4e342e';ctx.fillRect(x+10,y+14,12,16);ctx.fillStyle='#1b5e20';ctx.beginPath();ctx.arc(x+16,y+10,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2e7d32';ctx.beginPath();ctx.arc(x+15,y+8,7,0,Math.PI*2);ctx.fill()}
}

function drawP(x,y,dir,frame,st){
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(x+16,y+30,10,3,0,0,Math.PI*2).fill();
  const bob=st==='walk'?[0,-1,0,1][frame]:0;
  const leg=st==='walk'?[0,2,0,-2][frame]:0;
  const cx=x+16,cy=y+16+bob;
  ctx.fillStyle='#5d4037';ctx.fillRect(cx-4,cy+2,3,10+leg);ctx.fillRect(cx+1,cy+2,3,10-leg);
  ctx.fillStyle='#3e2723';ctx.fillRect(cx-4,cy+10+leg,3,3);ctx.fillRect(cx+1,cy+10-leg,3,3);
  ctx.fillStyle='#1565c0';ctx.fillRect(cx-6,cy-6,12,10);ctx.fillStyle='#1976d2';ctx.fillRect(cx-5,cy-5,10,8);
  ctx.fillStyle='#ffccbc';ctx.fillRect(cx-5,cy-14,10,10);ctx.fillStyle='#ffe0b2';ctx.fillRect(cx-4,cy-12,8,6);
  ctx.fillStyle='#3e2723';ctx.fillRect(cx-6,cy-16,12,4);
  if(dir!==3){ctx.fillStyle='#fff';ctx.fillRect(cx-3,cy-10,3,3);ctx.fillRect(cx+1,cy-10,3,3);ctx.fillStyle='#1a1a1a';ctx.fillRect(cx-2,cy-9,2,2);ctx.fillRect(cx+2,cy-9,2,2)}
  if(st==='attack'&&frame<2){ctx.fillStyle='#b0bec5';ctx.fillRect(cx+8,cy-8,3,14);ctx.fillStyle='#ffc107';ctx.fillRect(cx+6,cy+4,7,3)}
}

function drawA(x,y,type,frame){
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(x+16,y+30,8,2,0,0,Math.PI*2).fill();
  const c={deer:[160,120,80],boar:[80,60,40],rabbit:[240,240,240],fox:[200,80,20],wolf:[80,80,80],bird:[40,100,200],cow:[250,250,250],sheep:[250,250,240],pig:[250,180,180],horse:[120,80,60],dog:[250,250,240],cat:[200,100,50],chicken:[250,250,240],fish:[100,180,255]}[type]||[150,150,150];
  ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
  if(type==='fish'){
    ctx.fillStyle='#0d47a1';ctx.fillRect(x,y,T,T);ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.beginPath();ctx.ellipse(x+16,y+16,10,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#212121';ctx.fillRect(x+8,y+14,2,2);
  }else if(type==='bird'||type==='chicken'){
    ctx.beginPath();ctx.ellipse(x+14,y+18,8,5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+22,y+12,5,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#212121';ctx.fillRect(x+24,y+11,2,2);ctx.fillStyle='#ff0';ctx.beginPath();ctx.moveTo(x+26,y+13);ctx.lineTo(x+30,y+12);ctx.lineTo(x+26,y+14);ctx.fill();
  }else{
    ctx.beginPath();ctx.ellipse(x+14,y+18,8,5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+22,y+12,5,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#212121';ctx.fillRect(x+24,y+11,2,2);
    if(type==='rabbit'){ctx.fillRect(x+22,y+6,2,4);ctx.fillRect(x+25,y+6,2,4)}
  }
}

function drawN(x,y){
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(x+16,y+30,8,2,0,0,Math.PI*2).fill();
  ctx.fillStyle='#795548';ctx.fillRect(x+6,y+2,20,10);ctx.fillRect(x+10,y,12,4);
  ctx.fillStyle='#ffccbc';ctx.fillRect(x+8,y+10,16,10);
  ctx.fillStyle='#1565c0';ctx.fillRect(x+6,y+18,20,12);
  ctx.fillStyle='#fff';ctx.fillRect(x+10,y+13,3,3);ctx.fillRect(x+18,y+13,3,3);
  ctx.fillStyle='#1a1a1a';ctx.fillRect(x+11,y+14,2,2);ctx.fillRect(x+19,y+14,2,2);
}

function render(){
  ctx.fillStyle='#1a3a1a';ctx.fillRect(0,0,VW,VH);
  const cx=P.x-VW/2+T/2,cy=P.y-VH/2+T/2;
  const sx=Math.max(0,Math.floor(cx/T)),sy=Math.max(0,Math.floor(cy/T));
  const ex=Math.min(WW-1,Math.ceil((cx+VW)/T)),ey=Math.min(WH-1,Math.ceil((cy+VH)/T));
  
  for(let ty=sy;ty<=ey;ty++)for(let tx=sx;tx<=ex;tx++)drawTile(world[ty][tx],tx*T-cx,ty*T-cy,vars[ty][tx]);
  
  const sorted=entities.filter(e=>{const ex=e.x-cx,ey=e.y-cy;return ex>-T&&ex<VW+T&&ey>-T&&ey<VH+T}).sort((a,b)=>a.y-b.y);
  
  const px=P.x-cx,py=P.y-cy;
  let dp=false;
  for(const e of sorted){
    if(!dp&&e.y>py){drawP(px,py,P.dir,P.f,P.st);dp=true}
    if(e.t==='a')drawA(e.x-cx,e.y-cy,e.a,e.f);
    else if(e.t==='n'){drawN(e.x-cx,e.y-cy);ctx.fillStyle='#fff';ctx.font='7px monospace';ctx.textAlign='center';ctx.fillText(e.name,e.x-cx+16,e.y-cy-4)}
  }
  if(!dp)drawP(px,py,P.dir,P.f,P.st);
}

function update(dt){
  let mx=0,my=0;
  if(keys['ArrowUp']||keys['w'])my=-1;if(keys['ArrowDown']||keys['s'])my=1;
  if(keys['ArrowLeft']||keys['a'])mx=-1;if(keys['ArrowRight']||keys['d'])mx=1;
  if(ja){mx=jx;my=jy}
  const sp=200;P.vx=mx*sp;P.vy=my*sp;
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  P.x=Math.max(0,Math.min(WW*T-T,P.x));P.y=Math.max(0,Math.min(WH*T-T,P.y));
  if(Math.abs(mx)>Math.abs(my))P.dir=mx>0?2:1;else if(my!==0)P.dir=my>0?0:3;
  if(P.atk>0){P.st='attack';P.atk-=dt}else if(Math.abs(P.vx)>1||Math.abs(P.vy)>1)P.st='walk';else P.st='idle';
  P.ft+=dt;if(P.ft>0.2){P.ft=0;P.f=(P.f+1)%4}
  for(const e of entities){if(e.t!=='a')continue;e.ft+=dt;if(e.ft>0.3){e.ft=0;e.f=(e.f+1)%4}const dx=P.x-e.x,dy=P.y-e.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<80&&dist>0){e.vx=-dx/dist*50*e.sp;e.vy=-dy/dist*50*e.sp}else if(dist>150){e.vx=(hsh(Math.floor(e.x)+e.f,Math.floor(e.y))%2?12:-12)*e.sp;e.vy=(hsh(Math.floor(e.x),Math.floor(e.y)+e.f)%2?12:-12)*e.sp}else{e.vx*=0.92;e.vy*=0.92}e.x+=e.vx*dt;e.y+=e.vy*dt;e.x=Math.max(0,Math.min(WW*T-T,e.x));e.y=Math.max(0,Math.min(WH*T-T,e.y))}
  if(P.xp>=P.lv*50){P.xp-=P.lv*50;P.lv++;P.mhp+=10;P.hp=P.mhp;P.mmp+=5;P.mp=P.mmp;dlg('NIVEL '+P.lv+'!')}
  document.getElementById('hp').style.width=(P.hp/P.mhp*100)+'%';
  document.getElementById('mp').style.width=(P.mp/P.mmp*100)+'%';
  document.getElementById('xp').style.width=(P.xp/(P.lv*50)*100)+'%';
  document.getElementById('gold').textContent='🪙 '+P.g;
}

(function(){
  const joy=document.getElementById('joy'),knob=document.getElementById('joy-knob');
  let active=false,cx=0,cy=0,ck=[];
  function start(e){active=true;const r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;move(e)}
  function move(e){if(!active)return;e.preventDefault();const t=e.touches?e.touches[0]:e;const dx=t.clientX-cx,dy=t.clientY-cy;const d=Math.min(Math.sqrt(dx*dx+dy*dy),30);const a=Math.atan2(dy,dx);knob.style.transform=`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px))`;if(d>10){const deg=(a*180/Math.PI+360)%360;let k=[];if(deg>=337.5||deg<22.5)k=['ArrowRight'];else if(deg<67.5)k=['ArrowRight','ArrowDown'];else if(deg<112.5)k=['ArrowDown'];else if(deg<157.5)k=['ArrowLeft','ArrowDown'];else if(deg<202.5)k=['ArrowLeft'];else if(deg<247.5)k=['ArrowLeft','ArrowUp'];else if(deg<292.5)k=['ArrowUp'];else k=['ArrowRight','ArrowUp'];ck.forEach(ky=>{if(!k.includes(ky))dispatchEvent(new KeyboardEvent('keyup',{key:ky}))});k.forEach(ky=>{if(!ck.includes(ky))dispatchEvent(new KeyboardEvent('keydown',{key:ky}))});ck=k}else end()}
  function end(){active=false;knob.style.transform='translate(-50%,-50%)';ck.forEach(k=>dispatchEvent(new KeyboardEvent('keyup',{key:k})));ck=[]}
  joy.addEventListener('touchstart',start,{passive:false});joy.addEventListener('touchmove',move,{passive:false});joy.addEventListener('touchend',end);
  joy.addEventListener('mousedown',start);addEventListener('mousemove',e=>{if(active)move(e)});addEventListener('mouseup',end);
  function bind(id,k){const b=document.getElementById(id);b.addEventListener('touchstart',e=>{e.preventDefault();dispatchEvent(new KeyboardEvent('keydown',{key:k}))},{passive:false});b.addEventListener('touchend',e=>{e.preventDefault();dispatchEvent(new KeyboardEvent('keyup',{key:k}))})}
  bind('atk',' ');bind('int','e');
})();

let last=0;
function loop(ts){const dt=Math.min((ts-last)/1000,0.1);last=ts;update(dt);render();requestAnimationFrame(loop)}

addEventListener('load',()=>{resize();last=performance.now();requestAnimationFrame(loop)});
addEventListener('resize',resize);
</script>
</body>
</html>
