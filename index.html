<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PachaMirai</title>
</head>
<body style="margin:0;padding:0;overflow:hidden;background:#1a3a1a;font-family:monospace">
<canvas id="c" style="display:block;position:fixed;top:0;left:0;width:100vw;height:100vh"></canvas>

<div id="ui" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:10">
  <div style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.85);border:2px solid #4a90d9;border-radius:8px;padding:8px 14px;color:#fff;min-width:120px;font-size:10px;pointer-events:auto">
    <div>HP <span id="hp-txt">100/100</span></div>
    <div>MP <span id="mp-txt">50/50</span></div>
    <div>XP <span id="xp-txt">0/50</span></div>
    <div id="lvl-row" style="margin-top:4px;color:#ffcc00">⭐ Nivel 1</div>
    <div id="gold-row" style="color:#ffcc00">🪙 50</div>
  </div>
  
  <div style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.85);border:2px solid #4a90d9;border-radius:50%;width:50px;height:50px;overflow:hidden;pointer-events:auto">
    <canvas id="mc" width="50" height="50" style="width:100%;height:100%"></canvas>
  </div>
  
  <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:rgba(0,0,0,0.8);padding:4px;border-radius:6px;border:1px solid #4a90d9;pointer-events:auto">
    <div class="slot active" style="width:32px;height:32px;border:1px solid #4a90d9;border-radius:4px;background:rgba(50,50,50,0.8);display:flex;align-items:center;justify-content:center;font-size:14px">⚔️</div>
    <div class="slot" style="width:32px;height:32px;border:1px solid #4a90d9;border-radius:4px;background:rgba(50,50,50,0.8);display:flex;align-items:center;justify-content:center;font-size:14px">✋</div>
    <div class="slot" style="width:32px;height:32px;border:1px solid #4a90d9;border-radius:4px;background:rgba(50,50,50,0.8);display:flex;align-items:center;justify-content:center;font-size:14px">🎒</div>
  </div>
</div>

<div id="joy" style="position:absolute;bottom:60px;left:50px;width:100px;height:100px;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.3);border-radius:50%;z-index:20">
  <div id="jk" style="position:absolute;top:50%;left:50%;width:40px;height:40px;background:rgba(255,255,255,0.4);border-radius:50%;transform:translate(-50%,-50%)"></div>
</div>

<div style="position:absolute;bottom:60px;right:50px;display:flex;flex-direction:column;gap:10px;z-index:20">
  <button id="btn-atk" style="width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.3);color:#fff;font-size:20px;cursor:pointer">⚔️</button>
  <button id="btn-act" style="width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.3);color:#fff;font-size:20px;cursor:pointer">✋</button>
</div>

<div id="dlg" style="display:none;position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;padding:10px 16px;border-radius:6px;font-size:12px;z-index:30"></div>

<script>
(function(){
  'use strict';
  
  const T=32,WW=40,WH=40;
  const cv=document.getElementById('c');
  const ctx=cv.getContext('2d');
  
  function resize(){
    cv.width=window.innerWidth;
    cv.height=window.innerHeight;
    ctx.imageSmoothingEnabled=false;
  }
  window.addEventListener('resize',resize);
  resize();
  
  function h(x,y){return ((x*374761393+y*668265263)^0x5bf03635)&0x7fffffff}
  
  // Mundo
  const world=[];
  for(let y=0;y<WH;y++){
    world[y]=[];
    for(let x=0;x<WW;x++){
      const v=h(x,y),r=(v%1000)/1000;
      let b=0;
      if(r<0.12)b=2;else if(r<0.22)b=3;else if(r<0.4)b=6;
      else if(r<0.6)b=0;else if(r<0.75)b=1;else if(r<0.85)b=4;else b=5;
      world[y][x]=b;
    }
  }
  
  // Suavizar
  for(let i=0;i<3;i++){
    const n=world.map(r=>[...r]);
    for(let y=1;y<WH-1;y++)for(let x=1;x<WW-1;x++){
      const c={};
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const b=world[y+dy][x+dx];c[b]=(c[b]||0)+1;
      }
      let mb=0,mc=0;
      for(const b in c)if(c[b]>mc){mc=c[b];mb=b}
      if(mc>=5)n[y][x]=mb;
    }
    for(let y=0;y<WH;y++)for(let x=0;x<WW;x++)world[y][x]=n[y][x];
  }
  
  // Entidades
  const entities=[];
  const at=['deer','boar','rabbit','fox','wolf','bird','cow','sheep','pig','dog','cat','chicken','fish'];
  for(let i=0;i<14;i++){
    entities.push({t:'a',a:at[i],x:10+(h(i,100)%20)*T,y:10+(h(i,200)%20)*T,vx:0,vy:0,f:0,ft:0,hp:3,sp:80+Math.random()*40});
  }
  entities.push({t:'n',n:'Viejo',x:20*T,y:18*T,d:['Bienvenido a PachaMirai','Explora con cuidado','Cuida la naturaleza']});
  entities.push({t:'n',n:'Guarda',x:30*T,y:28*T,d:['Los animales son inocentes','Usa el habla antes del acero']});
  
  // Jugador
  const P={x:WW*T/2,y:WH*T/2,vx:0,vy:0,dir:0,f:0,ft:0,st:'idle',atk:0,hp:100,mhp:100,mp:50,mmp:50,xp:0,lv:1,g:50};
  
  // Joystick
  let jx=0,jy=0;
  const joy=document.getElementById('joy');
  const knob=document.getElementById('jk');
  let active=false,cx=0,cy=0;
  
  joy.addEventListener('touchstart',function(e){
    e.preventDefault();
    active=true;
    const r=joy.getBoundingClientRect();
    cx=r.left+r.width/2;cy=r.top+r.height/2;
    move(e.touches[0]);
  },{passive:false});
  
  joy.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(!active)return;
    move(e.touches[0]);
  },{passive:false});
  
  joy.addEventListener('touchend',function(e){
    e.preventDefault();
    active=false;jx=0;jy=0;
    knob.style.transform='translate(-50%,-50%)';
  });
  
  function move(e){
    const dx=e.clientX-cx,dy=e.clientY-cy;
    const d=Math.min(Math.sqrt(dx*dx+dy*dy),30);
    const a=Math.atan2(dy,dx);
    knob.style.transform='translate(calc(-50% + '+Math.cos(a)*d+'px), calc(-50% + '+Math.sin(a)*d+'px))';
    jx=d>5?Math.cos(a)*d/30:0;
    jy=d>5?Math.sin(a)*d/30:0;
  }
  
  // Botones
  document.getElementById('btn-atk').onclick=function(){
    if(P.atk>0)return;
    P.atk=0.4;P.st='attack';
    for(let i=entities.length-1;i>=0;i--){
      const e=entities[i];
      if(e.t!=='a')continue;
      if(Math.hypot(e.x-P.x,e.y-P.y)<40){
        e.hp--;
        if(e.hp<=0){P.xp+=10;entities.splice(i,1);dlg('+10 XP');}
      }
    }
  };
  
  document.getElementById('btn-act').onclick=function(){
    for(const e of entities){
      if(e.t==='n'&&Math.hypot(e.x-P.x,e.y-P.y)<50){
        dlg(e.n+': '+e.d[Math.floor(Math.random()*e.d.length)]);
        return;
      }
    }
  };
  
  function dlg(t){
    const d=document.getElementById('dlg');
    d.textContent=t;d.style.display='block';
    setTimeout(()=>d.style.display='none',2000);
  }
  
  // Render - cámara simple centrada en el jugador
  function render(){
    ctx.fillStyle='#1a3a1a';
    ctx.fillRect(0,0,cv.width,cv.height);
    
    const z=2; // zoom
    const ts=T*z; // tamaño tile en pantalla
    const cw=cv.width;
    const ch=cv.height;
    
    // Centro de la pantalla
    const centerX=cw/2;
    const centerY=ch/2;
    
    // El jugador está en el centro
    // Cada tile en (tx,ty) se dibuja en:
    // x = centerX + (tx*T - P.x) * z
    // y = centerY + (ty*T - P.y) * z
    
    // Solo dibujar tiles visibles
    const visibleTilesX = Math.ceil(cw / ts) + 2;
    const visibleTilesY = Math.ceil(ch / ts) + 2;
    
    const startX = Math.max(0, Math.floor(P.x/T) - Math.floor(visibleTilesX/2) - 1);
    const startY = Math.max(0, Math.floor(P.y/T) - Math.floor(visibleTilesY/2) - 1);
    const endX = Math.min(WW, Math.ceil(P.x/T) + Math.ceil(visibleTilesX/2) + 1);
    const endY = Math.min(WH, Math.ceil(P.y/T) + Math.ceil(visibleTilesY/2) + 1);
    
    for(let ty=startY; ty<endY; ty++){
      for(let tx=startX; tx<endX; tx++){
        const t=world[ty][tx];
        const cs=['#3a6b2a','#5d4037','#0d47a1','#f9a825','#616161','#e0e0e0','#2d5a2d'];
        
        // Posición en pantalla
        const sx = centerX + (tx*T - P.x) * z;
        const sy = centerY + (ty*T - P.y) * z;
        
        ctx.fillStyle=cs[t]||'#f0f';
        ctx.fillRect(sx, sy, ts+1, ts+1);
        
        if(t===0){
          ctx.fillStyle='#5a9a3a';
          ctx.fillRect(sx+4, sy+28, 3, 6);
          ctx.fillRect(sx+14, sy+27, 3, 7);
        }
        if(t===2){
          ctx.fillStyle='rgba(66,165,245,0.4)';
          ctx.fillRect(sx+4, sy+10, 10, 2);
        }
        if(t===6){
          ctx.fillStyle='#4e342e';
          ctx.fillRect(sx+11, sy+14, 10, 18);
          ctx.fillStyle='#1b5e20';
          ctx.beginPath(); ctx.arc(sx+16, sy+10, 10, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle='#2e7d32';
          ctx.beginPath(); ctx.arc(sx+15, sy+8, 7, 0, Math.PI*2); ctx.fill();
        }
      }
    }
    
    // Sprites RPG-JS (32x32, 4 dir x 4 frames)

    const heroImg = {};
    let heroLoaded = 0;
    for(const k in heroSprites){
      const img = new Image();
      img.src = heroSprites[k];
      heroImg[k] = img;
      img.onload = () => heroLoaded++;
    }
    
    // Dibujar jugador con sprite
    const dirNames = ['dir0','dir1','dir2','dir3']; // down, left, right, up
    const dirKey = dirNames[P.dir];
    let frameNum = 0;
    if(P.st==='walk'){
      frameNum = P.f % 4;
    }
    const spriteKey = dirKey + '_frame' + frameNum;
    
    if(heroImg[spriteKey] && heroImg[spriteKey].complete){
      ctx.drawImage(heroImg[spriteKey], centerX, centerY, 32*z, 32*z);
    } else {
      // Fallback: cuadrado rojo
      ctx.fillStyle='#e44';
      ctx.fillRect(centerX, centerY, 32*z, 32*z);
    }
    
    // Animales
    const AC={deer:[160,120,80],boar:[80,60,40],rabbit:[240,240,240],fox:[200,80,20],wolf:[80,80,80],bird:[40,100,200],cow:[250,250,250],sheep:[250,250,240],pig:[250,180,180],horse:[120,80,60],dog:[250,250,240],cat:[200,100,50],chicken:[250,250,240],fish:[100,180,255]};
    for(const e of entities){
      const sx=centerX+(e.x-P.x)*z, sy=centerY+(e.y-P.y)*z;
      if(sx<-50||sx>cv.width+50||sy<-50||sy>cv.height+50)continue;
      
      if(e.t==='a'){
        const c=AC[e.a]||[150,150,150];
        ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';
        ctx.beginPath(); ctx.ellipse(sx+16, sy+20, 12, 7, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(sx+26, sy+10, 7, 6, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle='#212121'; ctx.fillRect(sx+28, sy+8, 3, 3);
      } else {
        ctx.fillStyle='#795548'; ctx.fillRect(sx+8, sy+2, 24, 12); ctx.fillRect(sx+12, sy-2, 14, 5);
        ctx.fillStyle='#ffccbc'; ctx.fillRect(sx+10, sy+12, 20, 12);
        ctx.fillStyle='#1565c0'; ctx.fillRect(sx+8, sy+22, 24, 14);
        ctx.fillStyle='#fc0'; ctx.font='10px monospace'; ctx.textAlign='center'; ctx.fillText(e.n, sx+20, sy-6);
      }
    }
  }
  
  // Minimap
  function renderMM(){
    const mc=document.getElementById('mc');if(!mc)return;
    const mctx=mc.getContext('2d');
    mctx.fillStyle='#1a3a1a';mctx.fillRect(0,0,50,50);
    const r=15,ppx=Math.floor(P.x/T),ppy=Math.floor(P.y/T);
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      const wx=ppx+dx,wy=ppy+dy;if(wx<0||wx>=WW||wy<0||wy>=WH)continue;
      const t=world[wy][wx];
      mctx.fillStyle=t===0?'#4caf50':t===1?'#8d6e63':t===2?'#0288d1':t===3?'#f9a825':t===4?'#757575':t===5?'#fff':'#1b5e20';
      mctx.fillRect(25+dx*1.5,25+dy*1.5,1.5,1.5);
    }
    mctx.fillStyle='#fff';mctx.fillRect(24,24,2,2);
    mctx.fillStyle='#fc0';
    for(const e of entities)if(e.t==='n'){
      const nx=25+Math.floor((e.x/T-ppx)*1.5),ny=25+Math.floor((e.y/T-ppy)*1.5);
      if(nx>0&&nx<50&&ny>0&&ny<50)mctx.fillRect(nx-1,ny-1,3,3);
    }
  }
  
  // Update
  function update(dt){
    const sp=180;
    P.vx=jx*sp;P.vy=jy*sp;
    P.x+=P.vx*dt;P.y+=P.vy*dt;
    P.x=Math.max(T,Math.min(WW*T-T,P.x));
    P.y=Math.max(T,Math.min(WH*T-T,P.y));
    
    if(Math.abs(jx)>Math.abs(jy))P.dir=jx>0?2:1;
    else if(jy!==0)P.dir=jy>0?0:3;
    
    if(P.atk>0){P.st='attack';P.atk-=dt}
    else if(Math.abs(P.vx)>1||Math.abs(P.vy)>1)P.st='walk';
    else P.st='idle';
    P.ft+=dt;if(P.ft>0.2){P.ft=0;P.f=(P.f+1)%4}
    
    // Animales
    for(const e of entities){
      if(e.t!=='a')continue;
      const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy);
      if(d<80&&d>0){e.vx=-dx/d*120;e.vy=-dy/d*120}
      else if(d>200){e.vx=(Math.random()-0.5)*40;e.vy=(Math.random()-0.5)*40}
      else{e.vx*=0.95;e.vy*=0.95}
      e.x+=e.vx*dt;e.y+=e.vy*dt;
      e.x=Math.max(T,Math.min(WW*T-T,e.x));
      e.y=Math.max(T,Math.min(WH*T-T,e.y));
    }
    
    if(P.xp>=P.lv*50){P.xp-=P.lv*50;P.lv++;P.mhp+=10;P.hp=P.mhp;dlg('NIVEL '+P.lv+'!')}
    
    document.getElementById('hp-txt').textContent=P.hp+'/'+P.mhp;
    document.getElementById('mp-txt').textContent=P.mp+'/'+P.mmp;
    document.getElementById('xp-txt').textContent=P.xp+'/'+(P.lv*50);
    document.getElementById('lvl-row').textContent='⭐ Nivel '+P.lv;
    document.getElementById('gold-row').textContent='🪙 '+P.g;
  }
  
  let last=0;
  function loop(ts){
    const dt=Math.min((ts-last)/1000,0.1);
    last=ts;
    update(dt);
    render();
    renderMM();
    requestAnimationFrame(loop);
  }
  
  last=performance.now();
  requestAnimationFrame(loop);
})();
</script>
