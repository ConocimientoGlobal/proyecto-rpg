<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PachaMirai</title>
</head>
<body style="margin:0;padding:0;background:#1a3a1a;color:#fff;font-family:monospace">
<div id="debug" style="position:fixed;top:0;left:0;background:#000;color:#0f0;padding:10px;z-index:999;font-size:12px">Iniciando...</div>
<canvas id="c" style="display:block;position:fixed;top:0;left:0"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const debug = document.getElementById('debug');

function log(msg) { debug.innerHTML += '<br>' + msg; console.log(msg); }

try {
    log('1. Canvas creado');
    
    // Tamaño del canvas = tamaño de la ventana
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    log('2. Tamaño: ' + canvas.width + 'x' + canvas.height);
    
    // Fondo
    ctx.fillStyle = '#3a6b2a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    log('3. Fondo dibujado');
    
    // Jugador (círculo rojo)
    ctx.fillStyle = '#e44';
    ctx.beginPath();
    ctx.arc(canvas.width/2, canvas.height/2, 20, 0, Math.PI*2);
    ctx.fill();
    log('4. Jugador dibujado');
    
    // Animales (círculos grises)
    ctx.fillStyle = '#888';
    for(let i = 0; i < 8; i++) {
        ctx.beginPath();
        ctx.arc(100 + i*80, 200 + (i%3)*60, 15, 0, Math.PI*2);
        ctx.fill();
    }
    log('5. Animales dibujados');
    
    // Árboles (círculos verdes)
    ctx.fillStyle = '#2d5a2d';
    for(let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.arc(150 + i*150, 350, 25, 0, Math.PI*2);
        ctx.fill();
    }
    log('6. Árboles dibujados');
    
    // HUD
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(10, 10, 150, 80);
    ctx.fillStyle = '#fff';
    ctx.font = '14px monospace';
    ctx.fillText('HP: 100/100', 20, 35);
    ctx.fillText('MP: 50/50', 20, 55);
    ctx.fillText('XP: 0', 20, 75);
    log('7. HUD dibujado');
    
    // Controles táctiles
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.arc(80, canvas.height-80, 50, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText('MOVE', 60, canvas.height-75);
    
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.arc(canvas.width-80, canvas.height-80, 40, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.fillText('ATK', canvas.width-95, canvas.height-75);
    log('8. Controles dibujados');
    
    log('✅ JUEGO LISTO');
    
    // Loop simple
    let x = canvas.width/2, y = canvas.height/2;
    let keys = {};
    
    document.addEventListener('keydown', e => { keys[e.key] = true; });
    document.addEventListener('keyup', e => { keys[e.key] = false; });
    
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const t = e.touches[0];
        if(t.clientX < canvas.width/2) {
            // Joystick
            x += (t.clientX - 80) / 5;
            y += (t.clientY - (canvas.height-80)) / 5;
        }
    });
    
    function loop() {
        // Mover jugador
        if(keys['ArrowUp']) y -= 3;
        if(keys['ArrowDown']) y += 3;
        if(keys['ArrowLeft']) x -= 3;
        if(keys['ArrowRight']) x += 3;
        
        // Limitar
        x = Math.max(20, Math.min(canvas.width-20, x));
        y = Math.max(20, Math.min(canvas.height-20, y));
        
        // Redibujar
        ctx.fillStyle = '#3a6b2a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Jugador
        ctx.fillStyle = '#e44';
        ctx.beginPath();
        ctx.arc(x, y, 20, 0, Math.PI*2);
        ctx.fill();
        
        // Controles
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.arc(80, canvas.height-80, 50, 0, Math.PI*2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(canvas.width-80, canvas.height-80, 40, 0, Math.PI*2);
        ctx.fill();
        
        requestAnimationFrame(loop);
    }
    
    loop();
    log('✅ Loop iniciado');
    
} catch(err) {
    log('❌ ERROR: ' + err.message);
}
</script>
</body>
</html>
