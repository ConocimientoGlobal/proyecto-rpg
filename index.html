<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PachaMirai</title>
<style>
*{margin:0;padding:0;touch-action:none;user-select:none}
body{overflow:hidden;background:#1a3a1a;font-family:monospace}
canvas{display:block;position:fixed;top:0;left:0}
#ui{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:10}
#ui>div{pointer-events:auto}
#stats{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.8);border:2px solid #4a90d9;border-radius:8px;padding:8px;color:#fff;min-width:100px;font-size:10px}
.bar{width:80px;height:5px;background:#333;margin:2px 0;border-radius:2px}
.bar div{height:100%;border-radius:2px;transition:width 0.3s}
#hp-bar{background:linear-gradient(90deg,#e44,#c33)}
#mp-bar{background:linear-gradient(90deg,#48f,#36c)}
#xp-bar{background:linear-gradient(90deg,#fc0,#c90)}
#minimap{position:absolute;top:10px;right:10px;width:60px;height:60px;background:rgba(0,0,0,0.8);border:2px solid #4a90d9;border-radius:50%;overflow:hidden}
#hotbar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:rgba(0,0,0,0.7);padding:4px;border-radius:6px;border:1px solid #555}
.slot{width:28px;height:28px;border:1px solid #444;border-radius:4px;background:rgba(50,50,50,0.7);display:flex;align-items:center;justify-content:center;font-size:12px;position:relative}
.slot.active{border-color:#ffcc00;box-shadow:0 0 4px #ffcc00}
.slot .qty{position:absolute;bottom:0;right:1px;font-size:7px;color:#ffcc00}
#joy{position:absolute;bottom:50px;left:40px;width:80px;height:80px;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);border-radius:50%;touch-action:none}
#joy-knob{position:absolute;top:50%;left:50%;width:30px;height:30px;background:rgba(255,255,255,0.4);border-radius:50%;transform:translate(-50%,-50%)}
#btns{position:absolute;bottom:50px;right:40px;display:flex;flex-direction:column;gap:8px}
.btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;touch-action:none}
#dlg{display:none;position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;padding:10px 16px;border-radius:6px;font-size:12px;max-width:80%;text-align:center}
#menu{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.9);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.mbtn{width:180px;padding:10px;background:#333;border:1px solid #666;border-radius:6px;color:#fff;font-size:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="stats">
    <div>HP <span id="hp-txt">100/100</span></div>
    <div class="bar"><div id="hp-bar" style="width:100%"></div></div>
    <div>MP <span id="mp-txt">50/50</span></div>
    <div class="bar"><div id="mp-bar" style="width:100%"></div></div>
    <div>XP <span id="xp-txt">0/50</span></div>
    <div class="bar"><div id="xp-bar" style="width:0%"></div></div>
    <div id="lvl-row">⭐ Nivel 1</div>
    <div id="gold-row">🪙 50</div>
  </div>
  <div id="minimap"><canvas id="mc" width="100" height="100"></canvas></div>
  <div id="hotbar">
    <div class="slot active">⚔️</div><div class="slot">✋</div><div class="slot">🎒<span class="qty">3</span></div>
    <div class="slot">🌾</div><div class="slot">⛏️</div><div class="slot">🪓</div>
    <div class="slot">🧪<span class="qty">3</span></div><div class="slot">🍎</div>
    <div class="slot">💎</div><div class="slot">🪵</div>
  </div>
  <div id="joy"><div id="joy-knob"></div></div>
  <div id="btns">
    <div class="btn" id="atk">⚔️</div>
    <div class="btn" id="int">✋</div>
  </div>
</div>
<div id="dlg"></div>
<div id="menu">
  <button class="mbtn" id="m1">▶️ Resumir</button>
  <button class="mbtn" id="m2">💾 Guardar</button>
  <button class="mbtn" id="m3">📂 Cargar</button>
</div>
<script>
'use strict';

// ========== CONSTANTES ==========
const T = 32, VW = 800, VH = 450, WW = 64, WH = 64;

// ========== CANVAS ==========
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, SCALE = 1, camX = 0, camY = 0;

function resize() {
  W = innerWidth; H = innerHeight;
  SCALE = Math.max(2, Math.floor(Math.min(W/VW, H/VH)));
  canvas.width = VW * SCALE;
  canvas.height = VH * SCALE;
  canvas.style.width = (VW * SCALE) + 'px';
  canvas.style.height = (VH * SCALE) + 'px';
  canvas.style.left = ((W - VW * SCALE) / 2) + 'px';
  canvas.style.top = ((H - VH * SCALE) / 2) + 'px';
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingEnabled = false;
}

// ========== MUNDO ==========
function hsh(x, y) { return ((x*374761393+y*668265263)^0x5bf03635)&0x7fffffff }

const world = [], vars = [];
for (let y = 0; y < WH; y++) {
  world[y] = []; vars[y] = [];
  for (let x = 0; x < WW; x++) {
    const v = hsh(x, y);
    const r = (v % 1000) / 1000;
    let b = 0;
    if (r < 0.1) b = 2; else if (r < 0.2) b = 3; else if (r < 0.4) b = 6;
    else if (r < 0.6) b = 0; else if (r < 0.75) b = 1;
    else if (r < 0.85) b = 4; else b = 5;
    world[y][x] = b;
    vars[y][x] = v % 4;
  }
}

// Suavizar biomas
for (let iter = 0; iter < 3; iter++) {
  const nuevo = world.map(r => [...r]);
  for (let y = 1; y < WH-1; y++) {
    for (let x = 1; x < WW-1; x++) {
      const c = {};
      for (let dy = -1; dy <= 1; dy++)
        for (let dx = -1; dx <= 1; dx++) {
          const b = world[y+dy][x+dx];
          c[b] = (c[b] || 0) + 1;
        }
      let mb = 0, mc = 0;
      for (const b in c) { if (c[b] > mc) { mc = c[b]; mb = b; } }
      if (mc >= 5) nuevo[y][x] = mb;
    }
  }
  for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) world[y][x] = nuevo[y][x];
}

// ========== ENTIDADES ==========
const entities = [];
const animalTypes = ['deer','boar','rabbit','fox','wolf','bird','cow','sheep','pig','horse','dog','cat','chicken','fish'];

for (let i = 0; i < 12; i++) {
  entities.push({
    type: 'animal', animal: animalTypes[i%14],
    x: 30 + (hsh(i,100)%40)*T, y: 30 + (hsh(i,200)%40)*T,
    vx: 0, vy: 0, frame: 0, ft: 0, hp: 3, speed: 0.3 + Math.random()*0.3
  });
}

entities.push({type:'npc', name:'Viejo Sabio', x:40*T, y:35*T, dialogue:['Bienvenido a PachaMirai!','Explora con cuidado','Cuida la naturaleza']});
entities.push({type:'npc', name:'Guardabosque', x:55*T, y:50*T, dialogue:['No mates animales inocentes','Usa el dialogo primero']});

// ========== JUGADOR ==========
const player = {
  x: WW*T/2, y: WH*T/2,
  vx: 0, vy: 0, dir: 0, frame: 0, ft: 0,
  state: 'idle', atk: 0,
  hp: 100, maxHp: 100,
  mp: 50, maxMp: 50,
  xp: 0, lvl: 1, gold: 50
};

// ========== CONTROLES ==========
let jx = 0, jy = 0, ja = false, jsX = 0, jsY = 0, jid = null;
const keys = {};

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  if (t.clientX < W * 0.5) {
    ja = true; jid = t.identifier;
    jsX = t.clientX; jsY = t.clientY;
    jx = 0; jy = 0;
  }
}, {passive: false});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!ja) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === jid) {
      const dx = t.clientX - jsX, dy = t.clientY - jsY;
      const d = Math.sqrt(dx*dx + dy*dy), m = 25;
      if (d > m) { jx = dx*m/d; jy = dy*m/d; }
      else { jx = dx/m; jy = dy/m; }
    }
  }
}, {passive: false});

canvas.addEventListener('touchend', e => {
  for (let i = 0; i < e.changedTouches.length; i++)
    if (e.changedTouches[i].identifier === jid) {
      ja = false; jx = 0; jy = 0; jid = null;
    }
}, {passive: false});

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') { e.preventDefault(); doAttack(); }
  if (e.key === 'e') doInteract();
  if (e.key === 'Escape') toggleMenu();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// ========== FUNCIONES ==========
function doAttack() {
  if (player.atk > 0) return;
  player.atk = 0.5; player.state = 'attack';
  for (let i = entities.length-1; i >= 0; i--) {
    const e = entities[i];
    if (e.type !== 'animal') continue;
    const dx = e.x - player.x, dy = e.y - player.y;
    if (Math.sqrt(dx*dx + dy*dy) < 40) {
      e.hp--;
      if (e.hp <= 0) {
        player.xp += 5;
        showDialogue('+5 XP');
        entities.splice(i, 1);
      }
    }
  }
}

function doInteract() {
  for (const e of entities) {
    if (e.type === 'npc') {
      const dx = e.x - player.x, dy = e.y - player.y;
      if (Math.sqrt(dx*dx + dy*dy) < 50) {
        const msg = e.dialogue[Math.floor(Math.random()*e.dialogue.length)];
        showDialogue(e.name + ': ' + msg);
        return;
      }
    }
  }
}

function showDialogue(text) {
  const d = document.getElementById('dlg');
  d.textContent = text; d.style.display = 'block';
  setTimeout(() => d.style.display = 'none', 2500);
}

function toggleMenu() {
  const m = document.getElementById('menu');
  m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
}

document.getElementById('atk').onclick = doAttack;
document.getElementById('int').onclick = doInteract;
document.getElementById('m1').onclick = toggleMenu;
document.getElementById('m2').onclick = () => {
  localStorage.setItem('pacha_save', JSON.stringify(player));
  showDialogue('💾 Guardado');
};
document.getElementById('m3').onclick = () => {
  const s = localStorage.getItem('pacha_save');
  if (s) { Object.assign(player, JSON.parse(s)); showDialogue('📂 Cargado'); }
  else showDialogue('❌ Sin partida');
};

// ========== JOYSTICK ==========
(function() {
  const joy = document.getElementById('joy');
  const knob = document.getElementById('joy-knob');
  let active = false, cx = 0, cy = 0, curKeys = [];

  function start(e) {
    active = true;
    const r = joy.getBoundingClientRect();
    cx = r.left + r.width/2; cy = r.top + r.height/2;
    move(e);
  }

  function move(e) {
    if (!active) return;
    e.preventDefault();
    const t = e.touches ? e.touches[0] : e;
    const dx = t.clientX - cx, dy = t.clientY - cy;
    const d = Math.min(Math.sqrt(dx*dx+dy*dy), 30);
    const a = Math.atan2(dy, dx);
    knob.style.transform = `translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px))`;

    if (d > 8) {
      const deg = (a * 180/Math.PI + 360) % 360;
      let k = [];
      if (deg >= 337.5 || deg < 22.5) k = ['ArrowRight'];
      else if (deg < 67.5) k = ['ArrowRight','ArrowDown'];
      else if (deg < 112.5) k = ['ArrowDown'];
      else if (deg < 157.5) k = ['ArrowLeft','ArrowDown'];
      else if (deg < 202.5) k = ['ArrowLeft'];
      else if (deg < 247.5) k = ['ArrowLeft','ArrowUp'];
      else if (deg < 292.5) k = ['ArrowUp'];
      else k = ['ArrowRight','ArrowUp'];

      curKeys.forEach(ky => { if (!k.includes(ky)) document.dispatchEvent(new KeyboardEvent('keyup', {key:ky})); });
      k.forEach(ky => { if (!curKeys.includes(ky)) document.dispatchEvent(new KeyboardEvent('keydown', {key:ky})); });
      curKeys = k;
    } else end();
  }

  function end() {
    active = false;
    knob.style.transform = 'translate(-50%, -50%)';
    curKeys.forEach(k => document.dispatchEvent(new KeyboardEvent('keyup', {key:k})));
    curKeys = [];
  }

  joy.addEventListener('touchstart', start, {passive:false});
  joy.addEventListener('touchmove', move, {passive:false});
  joy.addEventListener('touchend', end);
  joy.addEventListener('mousedown', start);
  document.addEventListener('mousemove', e => { if(active) move(e); });
  document.addEventListener('mouseup', end);
})();

// ========== RENDERIZADO ==========

function drawTile(t, x, y, v) {
  const colors = [
    ['#3a6b2a','#4a7c2e','#387328','#48802c'], // pasto 0
    ['#5d4037','#6d4c41','#4e342e','#795548'], // tierra 1
    ['#0d47a1','#1565c0','#1565c0','#0d47a1'], // agua 2
    ['#f9a825','#f9a825','#c97c1a','#f9a825'], // arena 3
    ['#616161','#757575','#9e9e9e','#616161'], // piedra 4
    ['#e0e0e0','#ffffff','#e0e0e0','#ffffff'], // nieve 5
    ['#2d5a2d','#2d5a2d','#2d5a2d','#2d5a2d']  // árbol 6
  ];

  ctx.fillStyle = colors[t][v];
  ctx.fillRect(x, y, T, T);

  // Detalles
  if (t === 0) {
    ctx.fillStyle = '#5a9a3a';
    ctx.fillRect(x+4, y+26, 2, 6);
    ctx.fillRect(x+14, y+25, 2, 7);
    ctx.fillRect(x+24, y+27, 2, 5);
  } else if (t === 2) {
    ctx.fillStyle = 'rgba(66,165,245,0.5)';
    ctx.fillRect(x+4, y+8, 8, 2);
    ctx.fillRect(x+16, y+18, 6, 2);
  } else if (t === 6) {
    ctx.fillStyle = '#4e342e';
    ctx.fillRect(x+11, y+14, 10, 16);
    ctx.fillStyle = '#1b5e20';
    ctx.beginPath(); ctx.arc(x+16, y+10, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath(); ctx.arc(x+15, y+8, 7, 0, Math.PI*2); ctx.fill();
  }
}

function drawPlayer(x, y, dir, frame, state) {
  const bob = state === 'walk' ? [0,-2,0,2][frame] : 0;
  const leg = state === 'walk' ? [0,3,0,-3][frame] : 0;
  const cx = x+16, cy = y+16+bob;

  // Sombra
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx, cy+12, 8, 3, 0, 0, Math.PI*2); ctx.fill();

  // Piernas
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(cx-4, cy+2, 3, 10+leg);
  ctx.fillRect(cx+1, cy+2, 3, 10-leg);
  ctx.fillStyle = '#3e2723';
  ctx.fillRect(cx-4, cy+11+leg, 3, 3);
  ctx.fillRect(cx+1, cy+11-leg, 3, 3);

  // Cuerpo
  ctx.fillStyle = '#1565c0';
  ctx.fillRect(cx-6, cy-6, 12, 10);
  ctx.fillStyle = '#1976d2';
  ctx.fillRect(cx-5, cy-5, 10, 8);

  // Cabeza
  ctx.fillStyle = '#ffccbc';
  ctx.fillRect(cx-5, cy-14, 10, 10);
  ctx.fillStyle = '#ffe0b2';
  ctx.fillRect(cx-4, cy-12, 8, 6);

  // Pelo
  ctx.fillStyle = '#3e2723';
  ctx.fillRect(cx-6, cy-15, 12, 4);

  // Ojos
  if (dir !== 3) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx-3, cy-10, 3, 3);
    ctx.fillRect(cx+1, cy-10, 3, 3);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(cx-2, cy-9, 2, 2);
    ctx.fillRect(cx+2, cy-9, 2, 2);
  }

  // Espada
  if (state === 'attack' && frame < 2) {
    ctx.fillStyle = '#b0bec5';
    ctx.fillRect(cx+8, cy-10, 3, 14);
    ctx.fillStyle = '#ffc107';
    ctx.fillRect(cx+6, cy+4, 7, 3);
  }
}

function drawAnimal(x, y, type) {
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(x+16, y+30, 8, 2, 0, 0, Math.PI*2); ctx.fill();

  const colors = {
    deer: [160,120,80], boar: [80,60,40], rabbit: [240,240,240], fox: [200,80,20],
    wolf: [80,80,80], bird: [40,100,200], cow: [250,250,250], sheep: [250,250,240],
    pig: [250,180,180], horse: [120,80,60], dog: [250,250,240], cat: [200,100,50],
    chicken: [250,250,240], fish: [100,180,255]
  };
  const c = colors[type] || [150,150,150];

  ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;

  if (type === 'fish') {
    ctx.fillStyle = '#0d47a1'; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.beginPath(); ctx.ellipse(x+16, y+16, 10, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#212121'; ctx.fillRect(x+8, y+14, 2, 2);
  } else if (type === 'bird' || type === 'chicken') {
    ctx.beginPath(); ctx.ellipse(x+14, y+18, 8, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+22, y+12, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#212121'; ctx.fillRect(x+24, y+11, 2, 2);
    ctx.fillStyle = '#ff0';
    ctx.beginPath(); ctx.moveTo(x+26, y+13); ctx.lineTo(x+30, y+12); ctx.lineTo(x+26, y+14); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(x+14, y+18, 8, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+22, y+12, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#212121'; ctx.fillRect(x+24, y+11, 2, 2);
    if (type === 'rabbit') { ctx.fillRect(x+22, y+6, 2, 4); ctx.fillRect(x+25, y+6, 2, 4); }
  }
}

function drawNPC(x, y) {
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x+16, y+30, 8, 2, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#795548';
  ctx.fillRect(x+6, y+2, 20, 10);
  ctx.fillRect(x+10, y, 12, 4);
  ctx.fillStyle = '#ffccbc';
  ctx.fillRect(x+8, y+10, 16, 10);
  ctx.fillStyle = '#1565c0';
  ctx.fillRect(x+6, y+18, 20, 12);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x+10, y+13, 3, 3);
  ctx.fillRect(x+18, y+13, 3, 3);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(x+11, y+14, 2, 2);
  ctx.fillRect(x+19, y+14, 2, 2);
}

function render() {
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, 0, VW, VH);

  const cx = player.x - VW/2 + T/2;
  const cy = player.y - VH/2 + T/2;

  const sx = Math.max(0, Math.floor(cx/T));
  const sy = Math.max(0, Math.floor(cy/T));
  const ex = Math.min(WW-1, Math.ceil((cx+VW)/T));
  const ey = Math.min(WH-1, Math.ceil((cy+VH)/T));

  // Tiles
  for (let ty = sy; ty <= ey; ty++)
    for (let tx = sx; tx <= ex; tx++)
      drawTile(world[ty][tx], tx*T-cx, ty*T-cy, vars[ty][tx]);

  // Entidades ordenadas por Y (profundidad)
  const sorted = entities.filter(e => {
    const ex = e.x - cx, ey = e.y - cy;
    return ex > -T && ex < VW+T && ey > -T && ey < VH+T;
  }).sort((a,b) => a.y - b.y);

  const px = player.x - cx, py = player.y - cy;
  let drawnPlayer = false;

  for (const e of sorted) {
    if (!drawnPlayer && e.y > py) {
      drawPlayer(px, py, player.dir, player.frame, player.state);
      drawnPlayer = true;
    }
    if (e.type === 'animal')
      drawAnimal(e.x-cx, e.y-cy, e.animal);
    else if (e.type === 'npc') {
      drawNPC(e.x-cx, e.y-cy);
      ctx.fillStyle = '#fff';
      ctx.font = '7px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(e.name, e.x-cx+16, e.y-cy-4);
    }
  }

  if (!drawnPlayer)
    drawPlayer(px, py, player.dir, player.frame, player.state);
}

// ========== MINIMAPA ==========
function renderMinimap() {
  const mc = document.getElementById('mc');
  if (!mc) return;
  const mctx = mc.getContext('2d');
  mctx.imageSmoothingEnabled = false;
  mctx.fillStyle = '#1a3a1a';
  mctx.fillRect(0, 0, 100, 100);

  const r = 20;
  const ppx = Math.floor(player.x/T), ppy = Math.floor(player.y/T);

  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      const wx = ppx+dx, wy = ppy+dy;
      if (wx < 0 || wx >= WW || wy < 0 || wy >= WH) continue;
      const t = world[wy][wx];
      mctx.fillStyle = t===0 ? '#4caf50' : t===1 ? '#8d6e63' : t===2 ? '#0288d1' :
                       t===3 ? '#f9a825' : t===4 ? '#757575' : t===5 ? '#fff' : '#1b5e20';
      mctx.fillRect(50+dx*2.5, 50+dy*2.5, 2.5, 2.5);
    }
  }

  // Jugador
  mctx.fillStyle = '#fff';
  mctx.fillRect(49, 49, 3, 3);

  // NPCs
  mctx.fillStyle = '#fc0';
  for (const e of entities) {
    if (e.type === 'npc') {
      const nx = 50 + Math.floor((e.x/T - ppx) * 2.5);
      const ny = 50 + Math.floor((e.y/T - ppy) * 2.5);
      if (nx > 0 && nx < 100 && ny > 0 && ny < 100)
        mctx.fillRect(nx-1, ny-1, 3, 3);
    }
  }
}

// ========== UPDATE ==========
function update(dt) {
  let mx = 0, my = 0;
  if (keys['ArrowUp'] || keys['w']) my = -1;
  if (keys['ArrowDown'] || keys['s']) my = 1;
  if (keys['ArrowLeft'] || keys['a']) mx = -1;
  if (keys['ArrowRight'] || keys['d']) mx = 1;
  if (ja) { mx = jx; my = jy; }

  const sp = 180;
  player.vx = mx * sp; player.vy = my * sp;
  player.x += player.vx * dt; player.y += player.vy * dt;
  player.x = Math.max(0, Math.min(WW*T-T, player.x));
  player.y = Math.max(0, Math.min(WH*T-T, player.y));

  if (Math.abs(mx) > Math.abs(my)) player.dir = mx > 0 ? 2 : 1;
  else if (my !== 0) player.dir = my > 0 ? 0 : 3;

  if (player.atk > 0) { player.state = 'attack'; player.atk -= dt; }
  else if (Math.abs(player.vx) > 1 || Math.abs(player.vy) > 1) player.state = 'walk';
  else player.state = 'idle';

  player.ft += dt;
  if (player.ft > 0.2) { player.ft = 0; player.frame = (player.frame+1) % 4; }

  // Animales
  for (const e of entities) {
    if (e.type !== 'animal') continue;
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < 80 && dist > 0) {
      e.vx = -dx/dist * 40 * e.speed;
      e.vy = -dy/dist * 40 * e.speed;
    } else if (dist > 150) {
      e.vx = (hsh(Math.floor(e.x)+e.frame, Math.floor(e.y)) % 2 ? 8 : -8) * e.speed;
      e.vy = (hsh(Math.floor(e.x), Math.floor(e.y)+e.frame) % 2 ? 8 : -8) * e.speed;
    } else {
      e.vx *= 0.92; e.vy *= 0.92;
    }

    e.x += e.vx * dt; e.y += e.vy * dt;
    e.x = Math.max(0, Math.min(WW*T-T, e.x));
    e.y = Math.max(0, Math.min(WH*T-T, e.y));

    e.ft += dt;
    if (e.ft > 0.3) { e.ft = 0; e.frame = (e.frame+1) % 4; }
  }

  // Level up
  if (player.xp >= player.lvl * 50) {
    player.xp -= player.lvl * 50;
    player.lvl++;
    player.maxHp += 10; player.hp = player.maxHp;
    player.maxMp += 5; player.mp = player.maxMp;
    showDialogue('⭐ NIVEL ' + player.lvl + '!');
  }

  // HUD
  document.getElementById('hp-bar').style.width = (player.hp/player.maxHp*100) + '%';
  document.getElementById('mp-bar').style.width = (player.mp/player.maxMp*100) + '%';
  document.getElementById('xp-bar').style.width = (player.xp/(player.lvl*50)*100) + '%';
  document.getElementById('hp-txt').textContent = player.hp + '/' + player.maxHp;
  document.getElementById('mp-txt').textContent = player.mp + '/' + player.maxMp;
  document.getElementById('xp-txt').textContent = player.xp + '/' + (player.lvl*50);
  document.getElementById('lvl-row').textContent = '⭐ Nivel ' + player.lvl;
  document.getElementById('gold-row').textContent = '🪙 ' + player.gold;
}

// ========== GAME LOOP ==========
let last = 0;
function loop(ts) {
  const dt = Math.min((ts - last) / 1000, 0.1);
  last = ts;
  update(dt);
  render();
  renderMinimap();
  requestAnimationFrame(loop);
}

// Iniciar
resize();
last = performance.now();
requestAnimationFrame(loop);
</script>
