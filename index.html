<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PachaMirai</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a0a1a;font-family:'Segoe UI',monospace}
canvas{display:block;position:fixed;top:0;left:0}
#ui{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:10}
#ui>div{pointer-events:auto}
#stats{position:absolute;top:12px;left:12px;background:rgba(10,10,30,0.85);border:2px solid #4a90d9;border-radius:8px;padding:10px 14px;min-width:120px;color:#fff}
.bar-label{font-size:11px;color:#aaccee;margin-bottom:2px}
.bar-outer{width:100px;height:8px;background:#1a1a3a;border-radius:3px;overflow:hidden;margin-bottom:4px}
.bar-inner{height:100%;transition:width 0.3s;border-radius:2px}
.bar-hp .bar-inner{background:linear-gradient(180deg,#ff6666,#cc2222)}
.bar-mp .bar-inner{background:linear-gradient(180deg,#66aaff,#2255cc)}
.bar-xp .bar-inner{background:linear-gradient(180deg,#ffdd44,#cc9900)}
#minimap{position:absolute;top:12px;right:12px;width:90px;height:90px;background:rgba(10,10,30,0.85);border:2px solid #4a90d9;border-radius:50%;overflow:hidden}
#hotbar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:3px;background:rgba(10,10,30,0.8);padding:5px;border-radius:8px;border:1px solid #4a90d9}
.slot{width:36px;height:36px;border:1px solid #3a5a8a;border-radius:5px;background:rgba(20,20,50,0.8);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;position:relative}
.slot.active{border-color:#ffcc00;box-shadow:0 0 8px #ffcc00}
.slot .qty{position:absolute;bottom:1px;right:3px;font-size:9px;color:#ffcc00}
#joy{position:absolute;bottom:60px;left:50px;width:130px;height:130px;background:rgba(255,255,255,0.12);border:2px solid rgba(255,255,255,0.25);border-radius:50%;touch-action:none}
#joy-knob{position:absolute;top:50%;left:50%;width:54px;height:54px;background:rgba(255,255,255,0.45);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,0.4)}
#btns{position:absolute;bottom:60px;right:60px;display:flex;flex-direction:column;gap:14px}
.btn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;touch-action:none;box-shadow:0 3px 10px rgba(0,0,0,0.3)}
.btn:active{background:rgba(255,255,255,0.35);transform:scale(0.95)}
#dlg{display:none;position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(10,10,30,0.92);color:#fff;padding:14px 22px;border-radius:8px;border:2px solid #4a90d9;max-width:85%;font-size:14px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.6)}
#menu{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(5,5,20,0.95);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.mbtn{width:220px;padding:14px;background:rgba(30,30,60,0.9);border:2px solid #4a90d9;border-radius:8px;color:#fff;font-size:16px;text-align:center;font-family:inherit}
.mbtn:active{background:rgba(60,60,100,0.9)}
#loading{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0a0a1a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-direction:column;gap:16px}
</style>
</head>
<body>
<div id="loading">⏳ Cargando PachaMirai...</div>
<canvas id="c"></canvas>
<div id="ui">
  <div id="stats">
    <div class="bar-label">❤️ HP <span id="hp-txt">100/100</span></div>
    <div class="bar-outer bar-hp"><div class="bar-inner" id="hp-bar" style="width:100%"></div></div>
    <div class="bar-label">💧 MP <span id="mp-txt">50/50</span></div>
    <div class="bar-outer bar-mp"><div class="bar-inner" id="mp-bar" style="width:100%"></div></div>
    <div class="bar-label">⭐ Nivel <span id="lvl-txt">1</span></div>
    <div class="bar-outer bar-xp"><div class="bar-inner" id="xp-bar" style="width:0%"></div></div>
    <div class="bar-label" style="margin-top:4px">🪙 <span id="gold-txt">50</span></div>
  </div>
  <div id="minimap"><canvas id="mc" width="100" height="100"></canvas></div>
  <div id="hotbar">
    <div class="slot active" id="s0"><span>⚔️</span><span class="qty">1</span></div>
    <div class="slot" id="s1"><span>✋</span></div>
    <div class="slot" id="s2"><span>🎒</span><span class="qty">3</span></div>
    <div class="slot" id="s3"><span>🌾</span></div>
    <div class="slot" id="s4"><span>⛏️</span></div>
    <div class="slot" id="s5"><span>🪓</span></div>
    <div class="slot" id="s6"><span>🧪</span><span class="qty">3</span></div>
    <div class="slot" id="s7"><span>🍎</span></div>
    <div class="slot" id="s8"><span>💎</span></div>
    <div class="slot" id="s9"><span>🪵</span></div>
  </div>
  <div id="joy"><div id="joy-knob"></div></div>
  <div id="btns">
    <div class="btn" id="atk">⚔️</div>
    <div class="btn" id="int">✋</div>
  </div>
</div>
<div id="dlg"></div>
<div id="menu">
  <button class="mbtn" id="m1">▶️ Resumir</button>
  <button class="mbtn" id="m2">💾 Guardar</button>
  <button class="mbtn" id="m3">📂 Cargar</button>
  <button class="mbtn" id="m4">🚪 Salir</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script>
'use strict';

const T=32, WW=128, WH=128;
let app, worldContainer, entityContainer, playerSprite, camera = {x:0, y:0};
const entities = [];
let gameReady = false;

// ========== MUNDO ==========
function hsh(x,y){return ((x*374761393+y*668265263)^0x5bf03635)&0x7fffffff}

const world = [], vars = [];
for(let y=0;y<WH;y++){world[y]=[];vars[y]=[];for(let x=0;x<WW;x++){const v=hsh(x,y),r=(v%1000)/1000;let b=0;if(r<0.1)b=2;else if(r<0.2)b=3;else if(r<0.4)b=6;else if(r<0.6)b=0;else if(r<0.75)b=1;else if(r<0.85)b=4;else b=5;world[y][x]=b;vars[y][x]=v%4}}
for(let i=0;i<4;i++){const n=world.map(r=>[...r]);for(let y=1;y<WH-1;y++)for(let x=1;x<WW-1;x++){const c={};for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const b=world[y+dy][x+dx];c[b]=(c[b]||0)+1}let mb=0,mc=0;for(const b in c){if(c[b]>mc){mc=c[b];mb=b}}if(mc>=5)n[y][x]=mb}for(let y=0;y<WH;y++)for(let x=0;x<WW;x++)world[y][x]=n[y][x]}

// ========== JUGADOR ==========
const player = {
  x: WW*T/2, y: WH*T/2, vx:0, vy:0, dir:0, frame:0, ft:0, state:'idle', atk:0,
  hp:100, maxHp:100, mp:50, maxMp:50, xp:0, lvl:1, gold:50
};

// ========== INIT PIXI ==========
async function init() {
  app = new PIXI.Application();
  await app.init({
    width: Math.min(960, window.innerWidth),
    height: Math.min(540, window.innerHeight),
    backgroundColor: 0x1a3a1a,
    antialias: false,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true
  });
  
  document.getElementById('c').appendChild(app.canvas);
  document.getElementById('loading').style.display = 'none';
  
  worldContainer = new PIXI.Container();
  entityContainer = new PIXI.Container();
  app.stage.addChild(worldContainer);
  app.stage.addChild(entityContainer);
  
  createWorld();
  createPlayer();
  createEntities();
  
  // Cámara sigue al jugador
  app.ticker.add((ticker) => update(ticker.deltaMS / 1000));
  
  gameReady = true;
  resize();
}

function createWorld() {
  const tileColors = [0x3a6b2a, 0x5d4037, 0x0d47a1, 0xf9a825, 0x616161, 0xe0e0e0, 0x2d5a2d];
  
  for(let y=0; y<WH; y++) {
    for(let x=0; x<WW; x++) {
      const tile = new PIXI.Graphics();
      tile.beginFill(tileColors[world[y][x]]);
      tile.drawRect(x*T, y*T, T, T);
      tile.endFill();
      
      // Detalles por tipo
      const t = world[y][x];
      if(t === 0) { // pasto
        tile.beginFill(0x5a9a3a);
        tile.drawRect(x*T+4, y*T+26, 2, 6);
        tile.drawRect(x*T+14, y*T+25, 2, 7);
        tile.endFill();
      } else if(t === 2) { // agua
        tile.beginFill(0x42a5f5, 0.6);
        tile.drawRect(x*T+4, y*T+8, 8, 2);
        tile.drawRect(x*T+16, y*T+18, 6, 2);
        tile.endFill();
      } else if(t === 6) { // árbol
        tile.beginFill(0x4e342e);
        tile.drawRect(x*T+11, y*T+14, 10, 16);
        tile.endFill();
        tile.beginFill(0x1b5e20);
        tile.drawCircle(x*T+16, y*T+10, 10);
        tile.endFill();
        tile.beginFill(0x2e7d32);
        tile.drawCircle(x*T+15, y*T+8, 7);
        tile.endFill();
      }
      
      worldContainer.addChild(tile);
    }
  }
}

function createPlayer() {
  const g = new PIXI.Graphics();
  
  // Sombra
  g.beginFill(0x000000, 0.3);
  g.drawEllipse(16, 30, 10, 3);
  g.endFill();
  
  // Piernas
  g.beginFill(0x5d4037);
  g.drawRect(12, 18, 3, 10);
  g.drawRect(17, 18, 3, 10);
  g.endFill();
  
  // Botas
  g.beginFill(0x3e2723);
  g.drawRect(12, 27, 3, 3);
  g.drawRect(17, 27, 3, 3);
  g.endFill();
  
  // Cuerpo
  g.beginFill(0x1565c0);
  g.drawRect(10, 8, 12, 12);
  g.endFill();
  g.beginFill(0x1976d2);
  g.drawRect(11, 9, 10, 10);
  g.endFill();
  
  // Cabeza
  g.beginFill(0xffccbc);
  g.drawRect(11, 0, 10, 10);
  g.endFill();
  
  // Pelo
  g.beginFill(0x3e2723);
  g.drawRect(10, -1, 12, 4);
  g.endFill();
  
  // Ojos
  g.beginFill(0xffffff);
  g.drawRect(13, 3, 3, 3);
  g.drawRect(17, 3, 3, 3);
  g.endFill();
  g.beginFill(0x1a1a1a);
  g.drawRect(14, 4, 2, 2);
  g.drawRect(18, 4, 2, 2);
  g.endFill();
  
  playerSprite = new PIXI.Graphics(g);
  playerSprite.x = player.x;
  playerSprite.y = player.y;
  entityContainer.addChild(playerSprite);
}

function createEntities() {
  const animalTypes = ['deer','boar','rabbit','fox','wolf','bird','cow','sheep','pig','horse','dog','cat','chicken','fish'];
  const animalColors = {
    deer: [0xa08060, 0xc8a46c], boar: [0x5d4037, 0x6d4c41], rabbit: [0xe0e0e0, 0xffffff],
    fox: [0xd84315, 0xe87820], wolf: [0x424242, 0x616161], bird: [0x1565c0, 0x2196f3],
    cow: [0xfafafa, 0xe0e0e0], sheep: [0xfafafa, 0xf5f5f5], pig: [0xf48fb1, 0xf8bbd0],
    horse: [0x8d6e63, 0xa1887f], dog: [0xfafafa, 0xf5f5f5], cat: [0xe65100, 0xff9800],
    chicken: [0xfafafa, 0xf5f5f5], fish: [0x42a5f5, 0x64b5f6]
  };
  
  for(let i=0;i<16;i++){
    const type = animalTypes[i%14];
    const c = animalColors[type] || [0x888888, 0xaaaaaa];
    
    const g = new PIXI.Graphics();
    g.beginFill(c[0]);
    g.drawEllipse(14, 20, 8, 5);
    g.endFill();
    g.beginFill(c[1]);
    g.drawEllipse(22, 14, 5, 4);
    g.endFill();
    g.beginFill(0x212121);
    g.drawRect(24, 13, 2, 2);
    g.endFill();
    
    const sprite = new PIXI.Graphics(g);
    sprite.x = 30 + (hsh(i,100)%80)*T;
    sprite.y = 30 + (hsh(i,200)%80)*T;
    
    entities.push({type:'animal', sprite, animalType:type, vx:0, vy:0, frame:0, ft:0, hp:3, speed:0.3+Math.random()*0.3});
    entityContainer.addChild(sprite);
  }
  
  // NPCs
  const npcData = [
    {name:'Viejo Sabio', x:50*T, y:45*T, dialogue:['Bienvenido a PachaMirai!','Explora con cuidado','Todo problema tiene más de una solución']},
    {name:'Guardabosque', x:70*T, y:60*T, dialogue:['Cuida la naturaleza','Los animales son inocentes']}
  ];
  
  npcData.forEach(npc => {
    const g = new PIXI.Graphics();
    g.beginFill(0x795548);
    g.drawRect(6, 2, 20, 10);
    g.drawRect(10, 0, 12, 4);
    g.endFill();
    g.beginFill(0xffccbc);
    g.drawRect(8, 10, 16, 10);
    g.endFill();
    g.beginFill(0x1565c0);
    g.drawRect(6, 18, 20, 12);
    g.endFill();
    
    const sprite = new PIXI.Graphics(g);
    sprite.x = npc.x;
    sprite.y = npc.y;
    entities.push({type:'npc', sprite, name:npc.name, dialogue:npc.dialogue});
    entityContainer.addChild(sprite);
  });
}

// ========== UPDATE ==========
function update(dt) {
  if(!gameReady) return;
  
  // Input
  let mx = 0, my = 0;
  if(keys['ArrowUp'] || keys['w']) my = -1;
  if(keys['ArrowDown'] || keys['s']) my = 1;
  if(keys['ArrowLeft'] || keys['a']) mx = -1;
  if(keys['ArrowRight'] || keys['d']) mx = 1;
  
  const sp = 200;
  player.vx = mx * sp;
  player.vy = my * sp;
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.x = Math.max(0, Math.min(WW*T-T, player.x));
  player.y = Math.max(0, Math.min(WH*T-T, player.y));
  
  if(Math.abs(mx) > Math.abs(my)) player.dir = mx > 0 ? 2 : 1;
  else if(my !== 0) player.dir = my > 0 ? 0 : 3;
  
  if(player.atk > 0) { player.state = 'attack'; player.atk -= dt; }
  else if(Math.abs(player.vx) > 1 || Math.abs(player.vy) > 1) player.state = 'walk';
  else player.state = 'idle';
  
  player.ft += dt;
  if(player.ft > 0.2) { player.ft = 0; player.frame = (player.frame+1) % 4; }
  
  // Animación de caminar
  const bob = player.state === 'walk' ? Math.sin(player.frame * Math.PI/2) * 2 : 0;
  playerSprite.x = player.x;
  playerSprite.y = player.y + bob;
  
  // Animales
  entities.forEach(e => {
    if(e.type !== 'animal') return;
    const dx = player.x - e.sprite.x;
    const dy = player.y - e.sprite.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if(dist < 80 && dist > 0) {
      e.vx = -dx/dist * 50 * e.speed;
      e.vy = -dy/dist * 50 * e.speed;
    } else if(dist > 150) {
      e.vx = (hsh(Math.floor(e.sprite.x)+e.frame, Math.floor(e.sprite.y)) % 2 ? 12 : -12) * e.speed;
      e.vy = (hsh(Math.floor(e.sprite.x), Math.floor(e.sprite.y)+e.frame) % 2 ? 12 : -12) * e.speed;
    } else {
      e.vx *= 0.92;
      e.vy *= 0.92;
    }
    
    e.sprite.x += e.vx * dt;
    e.sprite.y += e.vy * dt;
    e.sprite.x = Math.max(0, Math.min(WW*T-T, e.sprite.x));
    e.sprite.y = Math.max(0, Math.min(WH*T-T, e.sprite.y));
  });
  
  // Cámara
  camera.x = player.x - app.screen.width/2;
  camera.y = player.y - app.screen.height/2;
  worldContainer.x = -camera.x;
  worldContainer.y = -camera.y;
  entityContainer.x = -camera.x;
  entityContainer.y = -camera.y;
  
  // HUD
  document.getElementById('hp-bar').style.width = (player.hp/player.maxHp*100) + '%';
  document.getElementById('mp-bar').style.width = (player.mp/player.maxMp*100) + '%';
  document.getElementById('xp-bar').style.width = (player.xp/(player.lvl*50)*100) + '%';
  document.getElementById('hp-txt').textContent = player.hp + '/' + player.maxHp;
  document.getElementById('mp-txt').textContent = player.mp + '/' + player.maxMp;
  document.getElementById('lvl-txt').textContent = player.lvl;
  document.getElementById('gold-txt').textContent = player.gold;
}

// ========== CONTROLES ==========
const keys = {};

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if(e.key === ' ') doAttack();
  if(e.key === 'e') doInteract();
  if(e.key === 'Escape') toggleMenu();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

function doAttack() {
  if(player.atk > 0) return;
  player.atk = 0.5;
  player.state = 'attack';
  
  entities.forEach((e, i) => {
    if(e.type !== 'animal') return;
    const dx = e.sprite.x - player.x;
    const dy = e.sprite.y - player.y;
    if(Math.sqrt(dx*dx + dy*dy) < 40) {
      e.hp--;
      if(e.hp <= 0) {
        player.xp += 5;
        showFloat('+5 XP', e.sprite.x, e.sprite.y);
        entityContainer.removeChild(e.sprite);
        entities.splice(i, 1);
      }
    }
  });
}

function doInteract() {
  entities.forEach(e => {
    if(e.type === 'npc') {
      const dx = e.sprite.x - player.x;
      const dy = e.sprite.y - player.y;
      if(Math.sqrt(dx*dx + dy*dy) < 50) {
        showDialogue(e.name + ': ' + e.dialogue[Math.floor(Math.random()*e.dialogue.length)]);
      }
    }
  });
}

function showFloat(text, x, y) {
  const el = document.createElement('div');
  el.textContent = text;
  el.style.cssText = 'position:absolute;color:#ffcc00;font-size:12px;pointer-events:none;text-shadow:1px 1px 0 #000';
  el.style.left = (x - camera.x) + 'px';
  el.style.top = (y - camera.y - 20) + 'px';
  document.getElementById('ui').appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

function showDialogue(text) {
  const d = document.getElementById('dlg');
  d.textContent = text;
  d.style.display = 'block';
  setTimeout(() => d.style.display = 'none', 3000);
}

function toggleMenu() {
  const m = document.getElementById('menu');
  m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
}

document.getElementById('atk').onclick = doAttack;
document.getElementById('int').onclick = doInteract;
document.getElementById('m1').onclick = () => toggleMenu();
document.getElementById('m2').onclick = () => { localStorage.setItem('pacha_save', JSON.stringify(player)); showDialogue('💾 Guardado'); };
document.getElementById('m3').onclick = () => { const s = localStorage.getItem('pacha_save'); if(s) { Object.assign(player, JSON.parse(s)); showDialogue('📂 Cargado'); } else showDialogue('Sin partida'); };
document.getElementById('m4').onclick = () => toggleMenu();

// Joystick
(function() {
  const joy = document.getElementById('joy');
  const knob = document.getElementById('joy-knob');
  let active = false, cx = 0, cy = 0, curKeys = [];
  
  function start(e) {
    active = true;
    const rect = joy.getBoundingClientRect();
    cx = rect.left + rect.width/2;
    cy = rect.top + rect.height/2;
    move(e);
  }
  
  function move(e) {
    if(!active) return;
    e.preventDefault();
    const t = e.touches ? e.touches[0] : e;
    const dx = t.clientX - cx, dy = t.clientY - cy;
    const d = Math.min(Math.sqrt(dx*dx+dy*dy), 45);
    const a = Math.atan2(dy, dx);
    knob.style.transform = `translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px))`;
    if(d > 12) {
      const deg = (a*180/Math.PI + 360) % 360;
      let k = [];
      if(deg >= 337.5 || deg < 22.5) k = ['ArrowRight'];
      else if(deg < 67.5) k = ['ArrowRight','ArrowDown'];
      else if(deg < 112.5) k = ['ArrowDown'];
      else if(deg < 157.5) k = ['ArrowLeft','ArrowDown'];
      else if(deg < 202.5) k = ['ArrowLeft'];
      else if(deg < 247.5) k = ['ArrowLeft','ArrowUp'];
      else if(deg < 292.5) k = ['ArrowUp'];
      else k = ['ArrowRight','ArrowUp'];
      curKeys.forEach(ky => { if(!k.includes(ky)) document.dispatchEvent(new KeyboardEvent('keyup', {key:ky})); });
      k.forEach(ky => { if(!curKeys.includes(ky)) document.dispatchEvent(new KeyboardEvent('keydown', {key:ky})); });
      curKeys = k;
    } else end();
  }
  
  function end() {
    active = false;
    knob.style.transform = 'translate(-50%, -50%)';
    curKeys.forEach(k => document.dispatchEvent(new KeyboardEvent('keyup', {key:k})));
    curKeys = [];
  }
  
  joy.addEventListener('touchstart', start, {passive:false});
  joy.addEventListener('touchmove', move, {passive:false});
  joy.addEventListener('touchend', end);
  joy.addEventListener('mousedown', start);
  document.addEventListener('mousemove', e => { if(active) move(e); });
  document.addEventListener('mouseup', end);
})();

function resize() {
  if(app) {
    app.renderer.resize(window.innerWidth, window.innerHeight);
  }
}
window.addEventListener('resize', resize);

// Iniciar
init().catch(err => {
  console.error(err);
  document.getElementById('loading').textContent = 'Error: ' + err.message;
});
</script>
</body>
