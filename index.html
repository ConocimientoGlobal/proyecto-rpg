<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PachaMirai</title>
<style>
*{margin:0;padding:0;touch-action:none;user-select:none;image-rendering:pixelated}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:monospace}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#ui>div{pointer-events:auto}

/* HUD Pixel Art Style */
#hud-top{
  position:absolute;top:0;left:0;right:0;height:44px;
  background:#1a1a2e;
  border-bottom:3px solid #4a4a6a;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;color:#e0e0ff;font-size:11px;
}
.hud-group{display:flex;align-items:center;gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-label{font-size:9px;color:#a0a0d0;text-shadow:1px 1px 0 #000}
.bar-bg{width:70px;height:8px;background:#0a0a1a;border:2px solid #4a4a6a;overflow:hidden}
.bar-fill{height:100%;transition:width 0.3s}
#hp-fill{background:linear-gradient(180deg,#ff4444,#cc2222)}
#mp-fill{background:linear-gradient(180deg,#4488ff,#2244cc)}
#xp-fill{background:linear-gradient(180deg,#ffdd44,#cc9900)}

#minimap{
  width:50px;height:50px;
  background:#0a0a1a;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#2a2a4a;border-right-color:#2a2a4a;
  overflow:hidden;position:relative;
}
#minimap canvas{width:100%;height:100%}

/* Hotbar */
#hotbar{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  display:flex;gap:3px;
  background:#1a1a2e;padding:5px;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#2a2a4a;border-right-color:#2a2a4a;
}
.slot{
  width:40px;height:40px;
  background:#2a2a4a;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#1a1a2e;border-right-color:#1a1a2e;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;position:relative;
}
.slot:active,.slot.active{
  background:#3a3a5a;
  border-top-color:#1a1a2e;border-left-color:#1a1a2e;
  border-bottom-color:#6a6a8a;border-right-color:#6a6a8a;
}
.slot .count{
  position:absolute;bottom:0;right:2px;font-size:8px;
  color:#ffcc00;font-weight:bold;text-shadow:1px 1px 0 #000;
}

/* Controls */
#joystick{
  position:absolute;bottom:70px;left:40px;
  width:120px;height:120px;
  background:#2a2a4a;
  border:4px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#1a1a2e;border-right-color:#1a1a2e;
  border-radius:50%;touch-action:none;
}
#joy-knob{
  position:absolute;top:50%;left:50%;
  width:50px;height:50px;
  background:#5a5a8a;
  border:3px solid #8a8abd;
  border-top-color:#aacbff;border-left-color:#aacbff;
  border-bottom-color:#3a3a6a;border-right-color:#3a3a6a;
  border-radius:50%;transform:translate(-50%,-50%);
  pointer-events:none;
}

#action-btns{
  position:absolute;bottom:70px;right:40px;
  display:flex;flex-direction:column;gap:12px;
}
.abtn{
  width:56px;height:56px;border-radius:50%;
  background:#2a2a4a;
  border:4px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#1a1a2e;border-right-color:#1a1a2e;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;color:#fff;touch-action:none;
}
.abtn:active{
  background:#3a3a5a;
  border-top-color:#1a1a2e;border-left-color:#1a1a2e;
  border-bottom-color:#6a6a8a;border-right-color:#6a6a8a;
}

/* Dialogue */
#dialogue{
  display:none;position:absolute;bottom:140px;left:50%;
  transform:translateX(-50%);
  background:#1a1a2e;color:#e0e0ff;
  padding:12px 20px;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#0a0a1a;border-right-color:#0a0a1a;
  font-size:13px;max-width:85%;text-align:center;
  text-shadow:1px 1px 0 #000;
  box-shadow:4px 4px 0 #0a0a1a;
}

/* Menu */
#menu{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(5,5,20,0.96);z-index:100;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;
}
.mbtn{
  width:200px;padding:12px;
  background:#2a2a4a;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#1a1a2e;border-right-color:#1a1a2e;
  color:#e0e0ff;font-size:16px;text-align:center;font-family:inherit;
  text-shadow:1px 1px 0 #000;
}
.mbtn:active{
  background:#3a3a5a;
  border-top-color:#1a1a2e;border-left-color:#1a1a2e;
  border-bottom-color:#6a6a8a;border-right-color:#6a6a8a;
}

/* Inventory */
#inventory{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(5,5,20,0.96);z-index:100;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;
}
#inv-grid{
  display:grid;grid-template-columns:repeat(5,48px);gap:4px;
  background:#1a1a2e;padding:10px;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#0a0a1a;border-right-color:#0a0a1a;
}
.inv-slot{
  width:48px;height:48px;
  background:#2a2a4a;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#1a1a2e;border-right-color:#1a1a2e;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;position:relative;
}
.inv-slot .count{
  position:absolute;bottom:0;right:2px;font-size:9px;color:#fc0;
  text-shadow:1px 1px 0 #000;font-weight:bold;
}
#inv-close{
  width:140px;padding:10px;
  background:#2a2a4a;color:#e0e0ff;
  border:3px solid #4a4a6a;
  border-top-color:#6a6a8a;border-left-color:#6a6a8a;
  border-bottom-color:#1a1a2e;border-right-color:#1a1a2e;
  font-size:14px;text-align:center;font-family:inherit;
}

/* Floating messages */
.float-msg{
  position:absolute;font-size:12px;color:#ffcc00;
  pointer-events:none;text-shadow:2px 2px 0 #000;
  animation:floatUp 1.5s forwards;
  font-weight:bold;
}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <!-- HUD Superior -->
  <div id="hud-top">
    <div class="hud-group">
      <div class="stat">
        <span class="stat-label">HP <span id="hp-txt">100/100</span></span>
        <div class="bar-bg"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div>
      </div>
      <div class="stat">
        <span class="stat-label">MP <span id="mp-txt">50/50</span></span>
        <div class="bar-bg"><div class="bar-fill" id="mp-fill" style="width:100%"></div></div>
      </div>
      <div class="stat">
        <span class="stat-label">XP <span id="xp-txt">0/50</span></span>
        <div class="bar-bg"><div class="bar-fill" id="xp-fill" style="width:0%"></div></div>
      </div>
    </div>
    <div class="hud-group">
      <div style="text-align:center">
        <div style="color:#ffcc00;text-shadow:1px 1px 0 #000" id="lvl-display">Nv 1</div>
        <div style="color:#ffcc00;text-shadow:1px 1px 0 #000" id="gold-display">🪙 50</div>
      </div>
      <div id="minimap"><canvas id="mc" width="50" height="50"></canvas></div>
    </div>
  </div>

  <!-- Hotbar -->
  <div id="hotbar">
    <div class="slot active" data-slot="0">⚔️</div>
    <div class="slot" data-slot="1">🪓</div>
    <div class="slot" data-slot="2">⛏️</div>
    <div class="slot" data-slot="3">🌱</div>
    <div class="slot" data-slot="4">🪵<span class="count" id="inv-wood">0</span></div>
    <div class="slot" data-slot="5">🪨<span class="count" id="inv-stone">0</span></div>
    <div class="slot" data-slot="6">🧪<span class="count" id="inv-potion">3</span></div>
    <div class="slot" data-slot="7">🍎<span class="count" id="inv-apple">0</span></div>
  </div>

  <!-- Joystick -->
  <div id="joystick"><div id="joy-knob"></div></div>

  <!-- Action Buttons -->
  <div id="action-btns">
    <div class="abtn" id="btn-atk">⚔️</div>
    <div class="abtn" id="btn-act">✋</div>
    <div class="abtn" id="btn-inv">🎒</div>
  </div>
</div>

<!-- Dialogue -->
<div id="dialogue"></div>

<!-- Menu -->
<div id="menu">
  <div style="font-size:24px;color:#ffcc00;margin-bottom:10px;text-shadow:2px 2px 0 #000">PachaMirai</div>
  <button class="mbtn" id="m-resume">▶️ Resumir</button>
  <button class="mbtn" id="m-save">💾 Guardar</button>
  <button class="mbtn" id="m-load">📂 Cargar</button>
</div>

<!-- Inventory -->
<div id="inventory">
  <div style="font-size:18px;color:#ffcc00;margin-bottom:10px;text-shadow:1px 1px 0 #000">INVENTARIO</div>
  <div id="inv-grid"></div>
  <button id="inv-close">Cerrar</button>
</div>

<script src="game.js"></script>
</body>
</html>
