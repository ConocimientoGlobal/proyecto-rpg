<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PachaMirai</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a0a1a;margin:0;font-family:monospace}
canvas#c{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;image-rendering:pixelated;z-index:1}
#ui{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:10}
#ui>div{pointer-events:auto}
#player-panel{position:absolute;top:12px;left:12px;background:rgba(10,10,30,0.85);border:2px solid #4a90d9;border-radius:8px;padding:10px 14px;min-width:110px}
.bar-label{font-size:10px;color:#aaccee;margin-bottom:2px}
.bar-outer{width:100%;height:8px;background:#1a1a3a;border-radius:3px;overflow:hidden;margin-bottom:4px}
.bar-inner{height:100%;transition:width 0.3s}
.bar-hp .bar-inner{background:linear-gradient(180deg,#ff6666,#cc2222)}
.bar-mp .bar-inner{background:linear-gradient(180deg,#66aaff,#2255cc)}
.bar-xp .bar-inner{background:linear-gradient(180deg,#ffdd44,#cc9900)}
#minimap{position:absolute;top:12px;right:12px;width:80px;height:80px;background:rgba(10,10,30,0.85);border:2px solid #4a90d9;border-radius:50%;overflow:hidden}
#hotbar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:rgba(10,10,30,0.8);padding:4px;border-radius:6px;border:1px solid #4a90d9}
.slot{width:32px;height:32px;border:1px solid #3a5a8a;border-radius:4px;background:rgba(20,20,50,0.8);display:flex;align-items:center;justify-content:center;font-size:14px}
#joystick{position:absolute;bottom:50px;left:50px;width:110px;height:110px;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.25);border-radius:50%;touch-action:none}
#joystick-knob{position:absolute;top:50%;left:50%;width:46px;height:46px;background:rgba(255,255,255,0.4);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
#action-buttons{position:absolute;bottom:50px;right:50px;display:flex;flex-direction:column;gap:10px}
.action-btn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.12);border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;touch-action:none}
#dialogue{display:none;position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(10,10,30,0.92);color:#fff;padding:14px 22px;border-radius:8px;border:2px solid #4a90d9;max-width:85%;font-size:13px;text-align:center}
#menu{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(5,5,20,0.95);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.menu-btn{width:200px;padding:14px;background:rgba(30,30,60,0.9);border:2px solid #4a90d9;border-radius:8px;color:#fff;font-size:16px;font-family:inherit}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="player-panel">
    <div class="bar-label">❤️ HP</div>
    <div class="bar-outer bar-hp"><div class="bar-inner" id="hp-bar" style="width:100%"></div></div>
    <div class="bar-label">💧 MP</div>
    <div class="bar-outer bar-mp"><div class="bar-inner" id="mp-bar" style="width:100%"></div></div>
    <div class="bar-label">⭐ XP</div>
    <div class="bar-outer bar-xp"><div class="bar-inner" id="xp-bar" style="width:0%"></div></div>
    <div class="bar-label" style="margin-top:4px">🪙 <span id="gold-txt">50</span></div>
  </div>
  <div id="minimap"><canvas id="mc" width="100" height="100"></canvas></div>
  <div id="hotbar">
    <div class="slot active">⚔️</div><div class="slot">✋</div><div class="slot">🎒</div>
    <div class="slot">🌾</div><div class="slot">⛏️</div><div class="slot">🪓</div>
    <div class="slot">🧪</div><div class="slot">🍎</div><div class="slot">💎</div><div class="slot">🪵</div>
  </div>
  <div id="joystick"><div id="joystick-knob"></div></div>
  <div id="action-buttons">
    <div class="action-btn" id="btn-attack">⚔️</div>
    <div class="action-btn" id="btn-interact">✋</div>
  </div>
</div>
<div id="dialogue"></div>
<div id="menu">
  <button class="menu-btn" id="btn-resumir">▶️ Resumir</button>
  <button class="menu-btn" id="btn-guardar">💾 Guardar</button>
  <button class="menu-btn" id="btn-cargar">📂 Cargar</button>
  <button class="menu-btn" id="btn-salir">🚪 Salir</button>
</div>
<script>
'use strict';
const T=32,VW=800,VH=450,WW=128,WH=128;
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,SCALE=1;

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  SCALE=Math.max(1,Math.floor(Math.min(W/VW,H/VH)));
  canvas.width=VW*SCALE;canvas.height=VH*SCALE;
  canvas.style.width=(VW*SCALE)+'px';canvas.style.height=(VH*SCALE)+'px';
  canvas.style.left=((W-VW*SCALE)/2)+'px';canvas.style.top=((H-VH*SCALE)/2)+'px';
  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  ctx.imageSmoothingEnabled=false;
}
window.addEventListener('resize',resize);

// Mundo
function hsh(x,y){return ((x*374761393+y*668265263)^0x5bf03635)&0x7fffffff}

const world=[],variants=[];
for(let y=0;y<WH;y++){world[y]=[];variants[y]=[];for(let x=0;x<WW;x++){const v=hsh(x,y),r=(v%1000)/1000;let b=0;if(r<0.10)b=2;else if(r<0.20)b=3;else if(r<0.40)b=6;else if(r<0.60)b=0;else if(r<0.75)b=1;else if(r<0.85)b=4;else b=5;world[y][x]=b;variants[y][x]=v%4}}
for(let iter=0;iter<4;iter++){const nuevo=world.map(r=>[...r]);for(let y=1;y<WH-1;y++)for(let x=1;x<WW-1;x++){const c={};for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const b=world[y+dy][x+dx];c[b]=(c[b]||0)+1}let mb=0,mc=0;for(const b in c){if(c[b]>mc){mc=c[b];mb=b}}if(mc>=5)nuevo[y][x]=mb}for(let y=0;y<WH;y++)for(let x=0;x<WW;x++)world[y][x]=nuevo[y][x]}

// Entidades
const entities=[];
const animalTypes=['deer','boar','rabbit','fox','wolf','bird','cow','sheep','pig','horse','dog','cat','chicken','fish'];
for(let i=0;i<16;i++)entities.push({type:'animal',animal:animalTypes[i%14],x:30+(hsh(i,100)%80)*T,y:30+(hsh(i,200)%80)*T,vx:0,vy:0,frame:0,ft:0,state:'idle',hp:3,speed:0.3+Math.random()*0.3});
entities.push({type:'npc',name:'Viejo Sabio',x:50*T,y:45*T,dialogue:['Bienvenido a PachaMirai!','Explora con cuidado','Todo problema tiene mas de una solucion']});
entities.push({type:'npc',name:'Guardabosque',x:70*T,y:60*T,dialogue:['Cuida la naturaleza','Los animales son inocentes']});

const player={x:WW*T/2,y:WH*T/2,vx:0,vy:0,dir:0,frame:0,ft:0,state:'idle',atk:0,hp:100,maxHp:100,mp:50,maxMp:50,xp:0,lvl:1,gold:50};

// Controles
let jx=0,jy=0,ja=false,jsX=0,jsY=0,jid=null;
const keys={};
canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];if(t.clientX<W*0.5){ja=true;jid=t.identifier;jsX=t.clientX;jsY=t.clientY;jx=0;jy=0}},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!ja)return;for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i];if(t.identifier===jid){const dx=t.clientX-jsX,dy=t.clientY-jsY;const d=Math.sqrt(dx*dx+dy*dy),m=30;if(d>m){jx=dx*m/d;jy=dy*m/d}else{jx=dx/m;jy=dy/m}}}},{passive:false});
canvas.addEventListener('touchend',e=>{for(let i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===jid){ja=false;jx=0;jy=0;jid=null}}},{passive:false});
document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='Escape')toggleMenu()});
document.addEventListener('keyup',e=>{keys[e.key]=false});

function doAttack(){if(player.atk>0)return;player.atk=0.5;player.state='attack';for(let i=entities.length-1;i>=0;i--){const e=entities[i];if(e.type!=='animal')continue;const dx=e.x-player.x,dy=e.y-player.y;if(Math.sqrt(dx*dx+dy*dy)<40){e.hp--;if(e.hp<=0){player.xp+=5;entities.splice(i,1)}}}}
function doInteract(){for(const e of entities){if(e.type==='npc'){const dx=e.x-player.x,dy=e.y-player.y;if(Math.sqrt(dx*dx+dy*dy)<50){showDialogue(e.name+': '+e.dialogue[Math.floor(Math.random()*e.dialogue.length)]);return}}}
function showDialogue(t){const d=document.getElementById('dialogue');d.textContent=t;d.style.display='block';setTimeout(()=>d.style.display='none',3000)}
function toggleMenu(){const m=document.getElementById('menu');m.style.display=m.style.display==='flex'?'none':'flex'}
document.getElementById('btn-resumir').onclick=()=>toggleMenu();
document.getElementById('btn-guardar').onclick=()=>{localStorage.setItem('pacha_save',JSON.stringify(player));showDialogue('Guardado')};
document.getElementById('btn-cargar').onclick=()=>{const s=localStorage.getItem('pacha_save');if(s){Object.assign(player,JSON.parse(s));showDialogue('Cargado')}else showDialogue('Sin partida')};
document.getElementById('btn-salir').onclick=()=>toggleMenu();

// Render
function drawTile(t,x,y,v){
  const colors=[
    ['#3a6b2a','#4a7c2e','#387328','#48802c'], // pasto 0
    ['#5d4037','#6d4c41','#4e342e','#795548'], // tierra 1
    ['#0d47a1','#1565c0','#1565c0','#0d47a1'], // agua 2
    ['#f9a825','#f9a825','#c97c1a','#f9a825'], // arena 3
    ['#616161','#757575','#9e9e9e','#616161'], // piedra 4
    ['#e0e0e0','#ffffff','#e0e0e0','#ffffff'], // nieve 5
    ['#2d5a2d','#2d5a2d','#2d5a2d','#2d5a2d']  // bosque 6
  ];
  ctx.fillStyle=colors[t][v];ctx.fillRect(x,y,T,T);
  if(t===0){ctx.fillStyle='#5a9a3a';ctx.fillRect(x+4,y+26,2,6);ctx.fillRect(x+14,y+25,2,7);ctx.fillRect(x+24,y+27,2,5)}
  if(t===2){ctx.fillStyle='#42a5f5';ctx.fillRect(x+4,y+8,8,2);ctx.fillRect(x+16,y+16,6,2);ctx.fillRect(x+8,y+24,10,2)}
  if(t===6){ctx.fillStyle='#4e342e';ctx.fillRect(x+10,y+14,12,16);ctx.fillStyle='#1b5e20';ctx.beginPath();ctx.arc(x+16,y+10,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2e7d32';ctx.beginPath();ctx.arc(x+15,y+8,7,0,Math.PI*2);ctx.fill()}
}

function drawPlayer(x,y,dir,frame,state){
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(x+16,y+30,10,3,0,0,Math.PI*2);ctx.fill();
  const bob=state==='walk'?[0,-1,0,1][frame]:0;
  const leg=state==='walk'?[0,2,0,-2][frame]:0;
  const cx=x+16,cy=y+16+bob;
  ctx.fillStyle='#5d4037';ctx.fillRect(cx-4,cy+2,3,10+leg);ctx.fillRect(cx+1,cy+2,3,10-leg);
  ctx.fillStyle='#3e2723';ctx.fillRect(cx-4,cy+10+leg,3,3);ctx.fillRect(cx+1,cy+10-leg,3,3);
  ctx.fillStyle='#1565c0';ctx.fillRect(cx-6,cy-6,12,10);ctx.fillStyle='#1976d2';ctx.fillRect(cx-5,cy-5,10,8);
  ctx.fillStyle='#ffccbc';ctx.fillRect(cx-5,cy-14,10,10);ctx.fillStyle='#ffe0b2';ctx.fillRect(cx-4,cy-12,8,6);
  ctx.fillStyle='#3e2723';ctx.fillRect(cx-6,cy-16,12,4);
  if(dir!==3){ctx.fillStyle='#fff';ctx.fillRect(cx-3,cy-10,3,3);ctx.fillRect(cx+1,cy-10,3,3);ctx.fillStyle='#1a1a1a';ctx.fillRect(cx-2,cy-9,2,2);ctx.fillRect(cx+2,cy-9,2,2)}
  if(state==='attack'&&frame<2){ctx.fillStyle='#b0bec5';ctx.fillRect(cx+8,cy-8,3,14);ctx.fillStyle='#ffc107';ctx.fillRect(cx+6,cy+4,7,3)}
}

function drawAnimal(x,y,type,frame){
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(x+16,y+30,8,2,0,0,Math.PI*2).fill();
  const c={deer:[160,120,80],boar:[80,60,40],rabbit:[240,240,240],fox:[200,80,20],wolf:[80,80,80],bird:[40,100,200],cow:[250,250,250],sheep:[250,250,240],pig:[250,180,180],horse:[120,80,60],dog:[250,250,240],cat:[200,100,50],chicken:[250,250,240],fish:[100,180,255]}[type]||[150,150,150];
  ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
  if(type==='fish'){
    ctx.fillStyle='#0d47a1';ctx.fillRect(x,y,T,T);ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.beginPath();ctx.ellipse(x+16,y+16,10,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#212121';ctx.fillRect(x+8,y+14,2,2);
  }else if(type==='bird'||type==='chicken'){
    ctx.beginPath();ctx.ellipse(x+14,y+18,8,5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+22,y+12,5,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#212121';ctx.fillRect(x+24,y+11,2,2);ctx.fillStyle='#ff0';ctx.beginPath();ctx.moveTo(x+26,y+13);ctx.lineTo(x+30,y+12);ctx.lineTo(x+26,y+14);ctx.fill();
  }else{
    ctx.beginPath();ctx.ellipse(x+14,y+18,8,5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+22,y+12,5,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#212121';ctx.fillRect(x+24,y+11,2,2);
    if(type==='rabbit'){ctx.fillRect(x+22,y+6,2,4);ctx.fillRect(x+25,y+6,2,4)}
  }
}

function drawNPC(x,y){
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(x+16,y+30,8,2,0,0,Math.PI*2).fill();
  ctx.fillStyle='#795548';ctx.fillRect(x+6,y+2,20,10);ctx.fillRect(x+10,y,12,4);
  ctx.fillStyle='#ffccbc';ctx.fillRect(x+8,y+10,16,10);
  ctx.fillStyle='#1565c0';ctx.fillRect(x+6,y+18,20,12);
  ctx.fillStyle='#fff';ctx.fillRect(x+10,y+13,3,3);ctx.fillRect(x+18,y+13,3,3);
  ctx.fillStyle='#1a1a1a';ctx.fillRect(x+11,y+14,2,2);ctx.fillRect(x+19,y+14,2,2);
}

function render(){
  ctx.fillStyle='#1a3a1a';ctx.fillRect(0,0,VW,VH);
  const cx=player.x-VW/2+T/2,cy=player.y-VH/2+T/2;
  const sx=Math.max(0,Math.floor(cx/T)),sy=Math.max(0,Math.floor(cy/T));
  const ex=Math.min(WW-1,Math.ceil((cx+VW)/T)),ey=Math.min(WH-1,Math.ceil((cy+VH)/T));
  
  for(let ty=sy;ty<=ey;ty++)for(let tx=sx;tx<=ex;tx++)drawTile(world[ty][tx],tx*T-cx,ty*T-cy,variants[ty][tx]);
  
  // Ordenar entidades por Y para profundidad
  const sorted=entities.filter(e=>{
    const ex=e.x-cx,ey=e.y-cy;
    return ex>-T&&ex<VW+T&&ey>-T&&ey<VH+T;
 }).sort((a,b)=>a.y-b.y);
  
  // Dibujar entidades y jugador en orden
  const px=player.x-cx,py=player.y-cy;
  let drawnPlayer=false;
  for(const e of sorted){
    if(!drawnPlayer&&e.y>py){drawPlayer(px,py,player.dir,player.frame,player.state);drawnPlayer=true}
    if(e.type==='animal')drawAnimal(e.x-cx,e.y-cy,e.animal,e.frame);
    else if(e.type==='npc'){drawNPC(e.x-cx,e.y-cy);ctx.fillStyle='#fff';ctx.font='7px monospace';ctx.textAlign='center';ctx.fillText(e.name,e.x-cx+16,e.y-cy-4)}
  }
  if(!drawnPlayer)drawPlayer(px,py,player.dir,player.frame,player.state);
}

function renderMinimap(){
  const mc=document.getElementById('mc');if(!mc)return;
  const mctx=mc.getContext('2d');mctx.imageSmoothingEnabled=false;
  mctx.fillStyle='#1a3a1a';mctx.fillRect(0,0,100,100);
  const r=15,ppx=Math.floor(player.x/T),ppy=Math.floor(player.y/T);
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const wx=ppx+dx,wy=ppy+dy;
    if(wx<0||wx>=WW||wy<0||wy>=WH)continue;
    const t=world[wy][wx];
    mctx.fillStyle=t===0?'#4caf50':t===1?'#8d6e63':t===2?'#0288d1':t===3?'#f9a825':t===4?'#757575':t===5?'#fff':'#1b5e20';
    mctx.fillRect(50+dx*3,50+dy*3,3,3);
  }
  mctx.fillStyle='#fff';mctx.fillRect(49,49,3,3);
  mctx.fillStyle='#fc0';
  for(const e of entities){if(e.type==='npc'){const nx=50+Math.floor((e.x/T-ppx)*3),ny=50+Math.floor((e.y/T-ppy)*3);if(nx>0&&nx<100&&ny>0&&ny<100)mctx.fillRect(nx-1,ny-1,3,3)}}
}

// Joystick UI
(function(){
  const joy=document.getElementById('joystick'),knob=document.getElementById('joystick-knob');
  let active=false,cx=0,cy=0,curKeys=[];
  function start(e){active=true;const r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;move(e)}
  function move(e){if(!active)return;e.preventDefault();const t=e.touches?e.touches[0]:e;const dx=t.clientX-cx,dy=t.clientY-cy;const d=Math.min(Math.sqrt(dx*dx+dy*dy),45);const a=Math.atan2(dy,dx);knob.style.transform=`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px))`;if(d>12){const deg=(a*180/Math.PI+360)%360;let k=[];if(deg>=337.5||deg<22.5)k=['ArrowRight'];else if(deg<67.5)k=['ArrowRight','ArrowDown'];else if(deg<112.5)k=['ArrowDown'];else if(deg<157.5)k=['ArrowLeft','ArrowDown'];else if(deg<202.5)k=['ArrowLeft'];else if(deg<247.5)k=['ArrowLeft','ArrowUp'];else if(deg<292.5)k=['ArrowUp'];else k=['ArrowRight','ArrowUp'];curKeys.forEach(ky=>{if(!k.includes(ky))window.dispatchEvent(new KeyboardEvent('keyup',{key:ky}))});k.forEach(ky=>{if(!curKeys.includes(ky))window.dispatchEvent(new KeyboardEvent('keydown',{key:ky}))});curKeys=k}else end()}
  function end(){active=false;knob.style.transform='translate(-50%,-50%)';curKeys.forEach(k=>window.dispatchEvent(new KeyboardEvent('keyup',{key:k})));curKeys=[]}
  joy.addEventListener('touchstart',start,{passive:false});joy.addEventListener('touchmove',move,{passive:false});joy.addEventListener('touchend',end);
  joy.addEventListener('mousedown',start);document.addEventListener('mousemove',e=>{if(active)move(e)});document.addEventListener('mouseup',end);
  function bind(id,k){const b=document.getElementById(id);b.addEventListener('touchstart',e=>{e.preventDefault();window.dispatchEvent(new KeyboardEvent('keydown',{key:k}))},{passive:false});b.addEventListener('touchend',e=>{e.preventDefault();window.dispatchEvent(new KeyboardEvent('keyup',{key:k}))})}
  bind('btn-attack',' ');bind('btn-interact','e');
})();

function update(dt){
  let mx=0,my=0;
  if(keys['ArrowUp']||keys['w'])my=-1;if(keys['ArrowDown']||keys['s'])my=1;
  if(keys['ArrowLeft']||keys['a'])mx=-1;if(keys['ArrowRight']||keys['d'])mx=1;
  if(ja){mx=jx;my=jy}
  const sp=200;player.vx=mx*sp;player.vy=my*sp;
  player.x+=player.vx*dt;player.y+=player.vy*dt;
  player.x=Math.max(0,Math.min(WW*T-T,player.x));player.y=Math.max(0,Math.min(WH*T-T,player.y));
  if(Math.abs(mx)>Math.abs(my))player.dir=mx>0?2:1;else if(my!==0)player.dir=my>0?0:3;
  if(player.atk>0){player.state='attack';player.atk-=dt}else if(Math.abs(player.vx)>1||Math.abs(player.vy)>1)player.state='walk';else player.state='idle';
  player.ft+=dt;if(player.ft>0.2){player.ft=0;player.frame=(player.frame+1)%4}
  for(const e of entities){if(e.type!=='animal')continue;e.ft+=dt;if(e.ft>0.3){e.ft=0;e.frame=(e.frame+1)%4}const dx=player.x-e.x,dy=player.y-e.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<80&&dist>0){e.vx=-dx/dist*50*e.speed;e.vy=-dy/dist*50*e.speed}else if(dist>150){e.vx=(hsh(Math.floor(e.x)+e.frame,Math.floor(e.y))%2?12:-12)*e.speed;e.vy=(hsh(Math.floor(e.x),Math.floor(e.y)+e.frame)%2?12:-12)*e.speed}else{e.vx*=0.92;e.vy*=0.92}e.x+=e.vx*dt;e.y+=e.vy*dt;e.x=Math.max(0,Math.min(WW*T-T,e.x));e.y=Math.max(0,Math.min(WH*T-T,e.y))}
  if(player.xp>=player.lvl*50){player.xp-=player.lvl*50;player.lvl++;player.maxHp+=10;player.hp=player.maxHp;player.maxMp+=5;player.mp=player.maxMp;showDialogue('NIVEL '+player.lvl+'!')}
  document.getElementById('hp-bar').style.width=(player.hp/player.maxHp*100)+'%';
  document.getElementById('mp-bar').style.width=(player.mp/player.maxMp*100)+'%';
  document.getElementById('xp-bar').style.width=(player.xp/(player.lvl*50)*100)+'%';
  document.getElementById('gold-txt').textContent=player.gold;
}

let last=0;
function loop(ts){const dt=Math.min((ts-last)/1000,0.1);last=ts;update(dt);render();renderMinimap();requestAnimationFrame(loop)}

window.addEventListener('load',()=>{resize();last=performance.now();requestAnimationFrame(loop)});
</script>
